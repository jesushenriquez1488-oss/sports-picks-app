
name: CashEdge NBA FanDuel Injury V3 Lineups

on:
  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nba-fanduel-lineups.yml"
      - "fantasy-engine/nba/teammate-impact.js"
      - "fantasy-engine/nba/injury-slate-bridge.js"
      - "fantasy-engine/nba/slate-history.js"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fanduel-injury-v3:
    name: FanDuel NBA Injury V3 CP-SAT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4
        with:
          ref: fantasy-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify updated modules
        run: |
          node <<'NODE'
          "use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const bridge = require(
            "./fantasy-engine/nba/injury-slate-bridge"
          );

          const teammate = require(
            "./fantasy-engine/nba/teammate-impact"
          );

          const source = fs.readFileSync(
            "fantasy-engine/nba/teammate-impact.js",
            "utf8"
          );

          assert.equal(
            typeof bridge.projectNBAWithInjuries,
            "function"
          );

          assert.equal(
            typeof teammate.evaluateTeammateImpact,
            "function"
          );

          assert.equal(
            source.includes(
              "NBA teammate impact: DraftKings only"
            ),
            false,
            "GitHub is using the old teammate-impact.js"
          );

          assert.ok(
            source.includes('"fanduel"'),
            "FanDuel support not found"
          );

          console.log(
            "=== MODULE VERSION CHECK ==="
          );

          console.log(
            "Branch: fantasy-dev"
          );

          console.log(
            "Teammate impact: DraftKings + FanDuel"
          );

          console.log(
            "Injury bridge V3: AVAILABLE"
          );

          console.log("PASS");
          NODE

      - name: Install dependencies
        run: |
          npm install --prefix fantasy-engine \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @supabase/supabase-js@2

          python -m pip install "ortools>=9.10,<10"

      - name: Recover verified FanDuel slate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p fantasy-fanduel-input

          FOUND=0

          for RUN_ID in $(gh run list \
            --workflow fantasy-nba-fanduel-slate.yml \
            --branch fantasy-dev \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId'); do

            if gh run download "$RUN_ID" \
              --name cashedge-nba-fanduel-78196 \
              --dir fantasy-fanduel-input; then

              if test -s \
                fantasy-fanduel-input/fanduel-78196.json; then
                FOUND=1
                echo "Recovered FanDuel slate from $RUN_ID"
                break
              fi
            fi
          done

          if test "$FOUND" -ne 1; then
            echo "FanDuel slate artifact not found"
            exit 1
          fi

      - name: Calculate FanDuel V3 injury projections
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          "use strict";

          const fs = require("node:fs");
          const assert = require("node:assert/strict");

          const { createClient } = require(
            "./fantasy-engine/node_modules/@supabase/supabase-js"
          );

          const {
            projectNBAWithInjuries,
            loadInjurySnapshots
          } = require(
            "./fantasy-engine/nba/injury-slate-bridge"
          );

          const asId = value =>
            value == null ? "" : String(value).trim();

          const requiredSlots = [
            "PG",
            "SG",
            "SF",
            "PF",
            "C",
            "G/F",
            "F/C",
            "UTIL",
            "UTIL"
          ].sort();

          const slate = JSON.parse(
            fs.readFileSync(
              "fantasy-fanduel-input/fanduel-78196.json",
              "utf8"
            )
          );

          function slotsOf(slate) {
            return slate.rosterSlots.flatMap(slot =>
              Array(Number(slot.count)).fill(
                String(slot.name).toUpperCase()
              )
            ).sort();
          }

          function validateSlate() {
            assert.equal(slate.sport, "nba");
            assert.equal(slate.platform, "fanduel");
            assert.equal(String(slate.slateId), "78196");
            assert.equal(slate.complete, true);
            assert.equal(Number(slate.salaryCap), 60000);
            assert.equal(slate.games.length, 11);

            assert.deepEqual(
              slotsOf(slate),
              requiredSlots
            );

            assert.ok(
              slate.players.length >= 100
            );

            assert.ok(
              Number.isFinite(Date.parse(slate.startsAt))
            );
          }

          function auditCoverage(snapshots, cutoffAt) {
            const games = new Map();

            for (const player of slate.players) {
              const gameId = asId(player.gameId);
              const teamId = asId(player.teamId);

              if (!gameId || !teamId) continue;

              if (!games.has(gameId)) {
                games.set(gameId, new Set());
              }

              games.get(gameId).add(teamId);
            }

            const coverage = [];

            for (const [gameId, teams] of games) {
              const matches = snapshots.filter(snapshot => {
                const injuryTeams = new Set([
                  asId(snapshot.away_team_id),
                  asId(snapshot.home_team_id)
                ]);

                return (
                  teams.size === 2 &&
                  [...teams].every(team =>
                    injuryTeams.has(team)
                  )
                );
              });

              const fresh = matches.find(snapshot => {
                const hours =
                  (
                    Date.parse(cutoffAt) -
                    Date.parse(snapshot.checked_at)
                  ) / 3600000;

                return (
                  hours >= 0 &&
                  hours <= 12 &&
                  Array.isArray(snapshot.injuries)
                );
              });

              coverage.push({
                gameId,
                teams: [...teams],
                matchingSnapshots: matches.length,
                freshSnapshot: Boolean(fresh),
                checkedAt: fresh?.checked_at || null,
                injuryCount:
                  fresh?.injuries?.length ?? null
              });
            }

            return coverage;
          }

          async function main() {
            validateSlate();

            const cutoffAt = new Date().toISOString();

            if (
              Date.parse(cutoffAt) >=
              Date.parse(slate.startsAt)
            ) {
              throw new Error(
                "This slate has already started. " +
                "Historical Shadow projections must " +
                "not be regenerated after tipoff."
              );
            }

            const url =
              process.env.FANTASY_SUPABASE_URL;

            const key =
              process.env.FANTASY_SUPABASE_SERVICE_ROLE_KEY;

            if (!url || !key) {
              throw new Error(
                "Missing Supabase credentials"
              );
            }

            const db = createClient(url, key, {
              auth: {
                persistSession: false,
                autoRefreshToken: false
              }
            });

            fs.mkdirSync(
              "fantasy-fanduel-v3-results",
              { recursive: true }
            );

            console.log(
              "=== FANDUEL NBA V3 ==="
            );

            console.log("Slate:", slate.slateId);
            console.log("Cutoff:", cutoffAt);

            const snapshots =
              await loadInjurySnapshots(
                db,
                cutoffAt
              );

            const coverage =
              auditCoverage(snapshots, cutoffAt);

            const matchedGames =
              coverage.filter(
                row => row.matchingSnapshots > 0
              ).length;

            const freshGames =
              coverage.filter(
                row => row.freshSnapshot
              ).length;

            console.log(
              "\n=== INJURY COVERAGE AUDIT ==="
            );

            console.log(JSON.stringify({
              totalGames: slate.games.length,
              sourceSnapshots: snapshots.length,
              matchedGames,
              freshGames,
              uncoveredGames:
                coverage.filter(
                  row => !row.freshSnapshot
                ).map(row => row.gameId),
              games: coverage
            }, null, 2));

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/injury-coverage.json",
              JSON.stringify({
                slateId: slate.slateId,
                cutoffAt,
                matchedGames,
                freshGames,
                coverage
              }, null, 2)
            );

            const result =
              await projectNBAWithInjuries({
                db,
                slate,
                cutoffAt
              });

            assert.equal(result.platform, "fanduel");
            assert.equal(
              result.scoringPlatform,
              "fanduel"
            );
            assert.equal(result.mode, "shadow");
            assert.equal(
              result.readyForPublication,
              false
            );

            assert.equal(
              result.players.length +
                result.excluded.length,
              slate.players.length
            );

            const allowedGames = [
              ...new Set(
                slate.players
                  .map(player => asId(player.gameId))
                  .filter(Boolean)
              )
            ];

            if (allowedGames.length !== 11) {
              throw new Error(
                "Expected 11 verified player game IDs"
              );
            }

            const validGames =
              new Set(allowedGames);

            const seen = new Set();

            const players = result.players.map(
              player => ({
                playerId: asId(player.playerId),
                name: player.name,
                teamId: asId(player.teamId),
                gameId: asId(player.gameId),
                salary: Number(player.salary),
                positions: player.positions,
                projectedPoints:
                  Number(player.projectedPoints)
              })
            );

            for (const player of players) {
              if (
                !player.playerId ||
                seen.has(player.playerId) ||
                !player.teamId ||
                !validGames.has(player.gameId) ||
                !Number.isFinite(player.salary) ||
                player.salary <= 0 ||
                !Array.isArray(player.positions) ||
                player.positions.length === 0 ||
                !Number.isFinite(player.projectedPoints) ||
                player.projectedPoints < 0
              ) {
                throw new Error(
                  "Invalid projected player: " +
                  player.playerId
                );
              }

              seen.add(player.playerId);
            }

            if (players.length < 9) {
              throw new Error(
                "Not enough valid FanDuel players"
              );
            }

            const payload = {
              sport: "nba",
              platform: "fanduel",
              slate: {
                id: String(slate.slateId),
                sport: "nba",
                platform: "fanduel",
                format: "classic",
                gameIds: allowedGames
              },
              players,
              lineupCount: 10,
              minDifferentPlayers: 2,
              maxExposurePercent: 100,
              timeLimitSeconds: 120,
              locked: [],
              excluded: []
            };

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/projections-v3.json",
              JSON.stringify(result, null, 2)
            );

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/optimizer-input.json",
              JSON.stringify(payload, null, 2)
            );

            console.log(
              "\n=== VERIFIED INJURY V3 RESULTS ==="
            );

            console.log(
              JSON.stringify({
                platform: result.platform,
                slateId: result.slateId,
                originalPlayers: slate.players.length,
                projected: result.players.length,
                excluded: result.excluded.length,
                removedConfirmedOut:
                  result.totals.removedConfirmedOut,
                injurySnapshotsMatched:
                  result.injurySnapshotCount,
                historicalSignals:
                  result.totals
                    .playersWithHistoricalSignals,
                playersAdjusted:
                  result.totals
                    .playersWithInjuryAdjustments,
                optimizerPlayers: players.length,
                freshInjuryGames: freshGames,
                mode: "shadow"
              }, null, 2)
            );

            console.log(
              "\n=== INJURY PLAYER ADJUSTMENTS ==="
            );

            for (const row of result.injuryAudit) {
              if (!row.actualAdjustment) continue;

              console.log(
                JSON.stringify({
                  player: row.name,
                  before: row.previousPoints,
                  after: row.adjustedPoints,
                  adjustment: row.actualAdjustment,
                  status: row.adjustmentStatus
                })
              );
            }

            console.log(
              "FANDUEL V3 PROJECTIONS: PASS"
            );
          }

          main().catch(error => {
            console.error(
              "FANDUEL V3 ERROR:",
              error.message
            );

            process.exitCode = 1;
          });
          NODE

      - name: Generate 10 FanDuel V3 lineups
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(
              0,
              "fantasy-engine/optimizer"
          )

          from recommendation_controller import recommend
          from solver import RULES

          folder = Path(
              "fantasy-fanduel-v3-results"
          )

          payload = json.loads(
              (folder / "optimizer-input.json").read_text()
          )

          expected_slots = {
              "PG", "SG", "SF", "PF", "C",
              "G/F", "F/C", "UTIL1", "UTIL2"
          }

          rules = RULES["nba"]["fanduel"]

          if (
              rules["salary_cap"] != 60000
              or set(rules["slots"]) != expected_slots
              or len(rules["slots"]) != 9
          ):
              raise RuntimeError(
                  "Incorrect FanDuel roster configuration"
              )

          result = recommend(payload)

          (folder / "lineups-v3.json").write_text(
              json.dumps(
                  result,
                  indent=2,
                  default=str
              )
          )

          if result.get("status") != "COMPLETE":
              raise RuntimeError(
                  "Optimizer did not complete: " +
                  str(result.get("status"))
              )

          primary = result.get("recommended") or {}

          if (
              primary.get("status") != "OPTIMAL"
              or primary.get(
                  "optimalityGuaranteed"
              ) is not True
              or result.get(
                  "mainOptimalityGuaranteed"
              ) is not True
          ):
              raise RuntimeError(
                  "Lineup #1 is not certified OPTIMAL"
              )

          lineups = [
              primary,
              *(result.get("alternatives") or [])
          ]

          if len(lineups) != 10:
              raise RuntimeError(
                  "Expected 10 FanDuel lineups"
              )

          print(
              "=== FANDUEL V3 OPTIMAL LINEUPS ===",
              flush=True
          )

          for index, lineup in enumerate(
              lineups,
              start=1
          ):
              players = lineup.get("players") or []

              ids = [
                  str(player["playerId"])
                  for player in players
              ]

              slots = [
                  player["slot"]
                  for player in players
              ]

              salary = sum(
                  int(player["salary"])
                  for player in players
              )

              if (
                  len(players) != 9
                  or len(set(ids)) != 9
                  or set(slots) != expected_slots
                  or salary > 60000
              ):
                  raise RuntimeError(
                      "Invalid lineup #" + str(index)
                  )

              print(
                  "\n=== LINEUP #" +
                  str(index) + " ===",
                  flush=True
              )

              print(
                  "Status:",
                  lineup.get("status"),
                  flush=True
              )

              print(
                  "Salary:",
                  salary,
                  flush=True
              )

              print(
                  "Projected points:",
                  lineup.get("projectedPoints"),
                  flush=True
              )

              for player in players:
                  print(
                      player["slot"],
                      player["name"],
                      "$" + str(player["salary"]),
                      player["projectedPoints"],
                      flush=True
                  )

          print(
              "\n=== FINAL FANDUEL NBA V3 ===",
              flush=True
          )

          print("PASS", flush=True)
          print("Lineups: 10", flush=True)
          print("Primary: OPTIMAL", flush=True)
          print("Platform: FanDuel", flush=True)
          print("Injury model: V3", flush=True)
          print("Mode: SHADOW", flush=True)
          print("No database writes", flush=True)
          print("No publication", flush=True)
          PY

      - name: Save FanDuel V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-nba-fanduel-injury-v3
          path: fantasy-fanduel-v3-results/*.json
          if-no-files-found: warn
          retention-days: 7
