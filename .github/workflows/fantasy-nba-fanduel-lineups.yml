
name: CashEdge NBA FanDuel Injury V3 Lineups

on:
  workflow_dispatch:

  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nba-fanduel-lineups.yml"

permissions:
  contents: read
  actions: read

jobs:
  fanduel-injury-v3:
    name: FanDuel NBA Injury V3 CP-SAT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install --prefix fantasy-engine \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @supabase/supabase-js@2

          python -m pip install "ortools>=9.10,<10"

      - name: Recover real FanDuel slate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p fantasy-fanduel-input

          FOUND=0

          for RUN_ID in $(gh run list \
            --workflow fantasy-nba-fanduel-slate.yml \
            --branch fantasy-dev \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId'); do

            if gh run download "$RUN_ID" \
              --name cashedge-nba-fanduel-78196 \
              --dir fantasy-fanduel-input; then

              if test -s \
                fantasy-fanduel-input/fanduel-78196.json; then

                FOUND=1
                echo "Slate recovered from run $RUN_ID"
                break
              fi
            fi
          done

          if test "$FOUND" -ne 1; then
            echo "FanDuel slate artifact missing"
            exit 1
          fi

      - name: Calculate FanDuel injury V3 projections
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          "use strict";

          const fs = require("node:fs");

          const { createClient } = require(
            "./fantasy-engine/node_modules/@supabase/supabase-js"
          );

          const { projectNBAWithInjuries } = require(
            "./fantasy-engine/nba/injury-slate-bridge"
          );

          const { loadInjurySnapshots } = require(
            "./fantasy-engine/nba/injury-slate-bridge"
          );

          const readJSON = file =>
            JSON.parse(fs.readFileSync(file, "utf8"));

          const asId = value =>
            value === null || value === undefined
              ? ""
              : String(value).trim();

          const REQUIRED = [
            "PG", "SG", "SF", "PF", "C",
            "G/F", "F/C", "UTIL", "UTIL"
          ].sort();

          function validateSlate(slate) {
            if (
              !slate ||
              slate.sport !== "nba" ||
              slate.platform !== "fanduel" ||
              String(slate.slateId) !== "78196" ||
              slate.complete !== true ||
              Number(slate.salaryCap) !== 60000 ||
              !Array.isArray(slate.games) ||
              slate.games.length !== 11 ||
              !Array.isArray(slate.players) ||
              slate.players.length < 100
            ) {
              throw new Error(
                "Invalid verified FanDuel slate"
              );
            }

            const slots = slate.rosterSlots
              .flatMap(slot =>
                Array(Number(slot.count)).fill(
                  String(slot.name).toUpperCase()
                )
              )
              .sort();

            if (
              JSON.stringify(slots) !==
              JSON.stringify(REQUIRED)
            ) {
              throw new Error(
                "Incorrect FanDuel roster slots"
              );
            }

            if (
              !Number.isFinite(Date.parse(slate.startsAt)) ||
              !Number.isFinite(Date.parse(slate.capturedAt)) ||
              Date.parse(slate.capturedAt) >=
                Date.parse(slate.startsAt)
            ) {
              throw new Error(
                "Invalid slate timestamps"
              );
            }
          }

          function gameCoverage(slate, snapshots, cutoffAt) {
            const games = new Map();

            for (const player of slate.players) {
              const id = asId(player.gameId);
              const team = asId(player.teamId);

              if (!id || !team) continue;

              if (!games.has(id)) {
                games.set(id, new Set());
              }

              games.get(id).add(team);
            }

            const diagnostics = [];

            for (const [gameId, teams] of games) {
              const gameTeams = [...teams];

              const matching = snapshots.filter(snapshot => {
                const medicalTeams = [
                  asId(snapshot.away_team_id),
                  asId(snapshot.home_team_id)
                ];

                return (
                  teams.size === 2 &&
                  gameTeams.every(team =>
                    medicalTeams.includes(team)
                  )
                );
              });

              const recent = matching.find(snapshot => {
                const ageHours =
                  (
                    Date.parse(cutoffAt) -
                    Date.parse(snapshot.checked_at)
                  ) / 3600000;

                return (
                  ageHours >= 0 &&
                  ageHours <= 12 &&
                  Array.isArray(snapshot.injuries)
                );
              });

              diagnostics.push({
                gameId,
                teams: gameTeams,
                matchingSnapshots: matching.length,
                freshSnapshot: Boolean(recent),
                checkedAt: recent?.checked_at || null,
                injuryCount:
                  recent?.injuries?.length ?? 0
              });
            }

            return diagnostics;
          }

          async function main() {
            const slate = readJSON(
              "fantasy-fanduel-input/fanduel-78196.json"
            );

            validateSlate(slate);

            const cutoffAt = new Date().toISOString();

            if (
              Date.parse(cutoffAt) >=
              Date.parse(slate.startsAt)
            ) {
              throw new Error(
                "Pregame slate expired. " +
                "Do not regenerate after games start."
              );
            }

            const url =
              process.env.FANTASY_SUPABASE_URL;

            const key =
              process.env.FANTASY_SUPABASE_SERVICE_ROLE_KEY;

            if (!url || !key) {
              throw new Error(
                "Missing Supabase server credentials"
              );
            }

            const db = createClient(url, key, {
              auth: {
                persistSession: false,
                autoRefreshToken: false
              }
            });

            console.log(
              "=== NBA FANDUEL INJURY V3 ==="
            );

            console.log("Slate:", slate.slateId);
            console.log("Players:", slate.players.length);
            console.log("Cutoff:", cutoffAt);

            const snapshots =
              await loadInjurySnapshots(
                db,
                cutoffAt
              );

            const coverage = gameCoverage(
              slate,
              snapshots,
              cutoffAt
            );

            console.log(
              "\n=== INJURY COVERAGE AUDIT ==="
            );

            console.log(
              JSON.stringify({
                sourceSnapshots: snapshots.length,
                matchedGames:
                  coverage.filter(row =>
                    row.matchingSnapshots > 0
                  ).length,
                freshGames:
                  coverage.filter(row =>
                    row.freshSnapshot
                  ).length,
                games: coverage
              }, null, 2)
            );

            // Este puente ya aplica:
            // - proyeccion FanDuel
            // - historiales reales
            // - lesionados confirmados OUT
            // - impacto historico por minuto
            // - minimo 4 juegos por condicion
            // - señales contradictorias: sin ajuste
            // - sin sumar multiples ausencias

            const result =
              await projectNBAWithInjuries({
                db,
                slate,
                cutoffAt
              });

            if (
              result.platform !== "fanduel" ||
              result.scoringPlatform !== "fanduel" ||
              result.mode !== "shadow" ||
              result.readyForPublication !== false
            ) {
              throw new Error(
                "Invalid V3 projection output"
              );
            }

            if (
              result.players.length +
              result.excluded.length !==
              slate.players.length
            ) {
              throw new Error(
                "Projection count mismatch"
              );
            }

            const gameIds = [
              ...new Set(
                result.players
                  .map(player => asId(player.gameId))
                  .filter(Boolean)
              )
            ];

            if (gameIds.length < 2) {
              throw new Error(
                "Insufficient real game IDs"
              );
            }

            const players = result.players.map(
              player => ({
                playerId: asId(player.playerId),
                name: player.name,
                teamId: asId(player.teamId),
                gameId: asId(player.gameId),
                salary: Number(player.salary),
                positions: player.positions,
                projectedPoints:
                  Number(player.projectedPoints)
              })
            );

            if (players.length < 9) {
              throw new Error(
                "Not enough eligible FanDuel players"
              );
            }

            const allowed = new Set(gameIds);
            const seen = new Set();

            for (const player of players) {
              if (
                !player.playerId ||
                seen.has(player.playerId) ||
                !player.teamId ||
                !allowed.has(player.gameId) ||
                !Number.isFinite(player.salary) ||
                player.salary <= 0 ||
                !Number.isFinite(
                  player.projectedPoints
                ) ||
                player.projectedPoints <= 0 ||
                !Array.isArray(player.positions) ||
                player.positions.length === 0
              ) {
                throw new Error(
                  "Invalid optimizer player: " +
                  player.playerId
                );
              }

              seen.add(player.playerId);
            }

            const payload = {
              sport: "nba",
              platform: "fanduel",
              slate: {
                id: String(slate.slateId),
                sport: "nba",
                platform: "fanduel",
                format: "classic",
                gameIds
              },
              players,
              lineupCount: 10,
              minDifferentPlayers: 2,
              maxExposurePercent: 100,
              timeLimitSeconds: 120,
              locked: [],
              excluded: []
            };

            fs.mkdirSync(
              "fantasy-fanduel-v3-results",
              { recursive: true }
            );

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/projections-v3.json",
              JSON.stringify(result, null, 2)
            );

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/injury-coverage.json",
              JSON.stringify({
                slateId: slate.slateId,
                cutoffAt,
                coverage
              }, null, 2)
            );

            fs.writeFileSync(
              "fantasy-fanduel-v3-results/optimizer-input.json",
              JSON.stringify(payload, null, 2)
            );

            console.log(
              "\n=== VERIFIED INJURY V3 RESULTS ==="
            );

            console.log(
              JSON.stringify({
                platform: result.platform,
                slateId: result.slateId,
                projected: result.players.length,
                excluded: result.excluded.length,
                removedConfirmedOut:
                  result.totals.removedConfirmedOut,
                injurySnapshotsMatched:
                  result.injurySnapshotCount,
                historicalSignals:
                  result.totals
                    .playersWithHistoricalSignals,
                playersAdjusted:
                  result.totals
                    .playersWithInjuryAdjustments,
                optimizerPlayers: players.length,
                mode: result.mode
              }, null, 2)
            );

            console.log(
              "\n=== INJURY PLAYER ADJUSTMENTS ==="
            );

            for (const row of
              result.injuryAudit.slice(0, 30)) {
              console.log(
                JSON.stringify({
                  player: row.name,
                  before: row.previousPoints,
                  after: row.adjustedPoints,
                  difference: row.actualAdjustment,
                  status: row.adjustmentStatus
                })
              );
            }

            console.log(
              "\nFANDUEL V3 PROJECTIONS: PASS"
            );
          }

          main().catch(error => {
            console.error(
              "FANDUEL V3 ERROR:",
              error.message
            );

            process.exitCode = 1;
          });
          NODE

      - name: Generate ten FanDuel V3 lineups
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(
              0,
              "fantasy-engine/optimizer"
          )

          from recommendation_controller import recommend
          from solver import RULES

          folder = Path(
              "fantasy-fanduel-v3-results"
          )

          payload = json.loads(
              (folder / "optimizer-input.json").read_text()
          )

          config = RULES["nba"]["fanduel"]

          expected = {
              "PG", "SG", "SF", "PF", "C",
              "G/F", "F/C", "UTIL1", "UTIL2"
          }

          if (
              config["salary_cap"] != 60000
              or set(config["slots"]) != expected
              or len(config["slots"]) != 9
          ):
              raise RuntimeError(
                  "Incorrect FanDuel CP-SAT rules"
              )

          result = recommend(payload)

          (folder / "lineups-v3.json").write_text(
              json.dumps(result, indent=2, default=str)
          )

          if result.get("status") != "COMPLETE":
              raise RuntimeError(
                  "FanDuel optimization incomplete: " +
                  str(result.get("status"))
              )

          primary = result.get("recommended") or {}

          if (
              primary.get("status") != "OPTIMAL"
              or primary.get(
                  "optimalityGuaranteed"
              ) is not True
              or result.get(
                  "mainOptimalityGuaranteed"
              ) is not True
          ):
              raise RuntimeError(
                  "Primary lineup not certified OPTIMAL"
              )

          lineups = [
              primary,
              *(result.get("alternatives") or [])
          ]

          if len(lineups) != 10:
              raise RuntimeError(
                  "Expected exactly 10 lineups"
              )

          print(
              "=== FANDUEL V3 OPTIMAL LINEUPS ===",
              flush=True
          )

          for index, lineup in enumerate(
              lineups, start=1
          ):
              players = lineup.get("players") or []

              ids = [
                  str(p["playerId"])
                  for p in players
              ]

              slots = [
                  p["slot"]
                  for p in players
              ]

              salary = sum(
                  int(p["salary"])
                  for p in players
              )

              if (
                  len(players) != 9
                  or len(set(ids)) != 9
                  or set(slots) != expected
                  or salary > 60000
              ):
                  raise RuntimeError(
                      f"Invalid FanDuel lineup #{index}"
                  )

              if (
                  index == 1 and
                  lineup.get("status") != "OPTIMAL"
              ):
                  raise RuntimeError(
                      "Lineup #1 is not OPTIMAL"
                  )

              print(
                  f"\n=== LINEUP #{index} ===",
                  flush=True
              )

              print(
                  "Status:",
                  lineup.get("status"),
                  flush=True
              )

              print(
                  "Salary:",
                  salary,
                  flush=True
              )

              print(
                  "Projected points:",
                  lineup.get("projectedPoints"),
                  flush=True
              )

              for player in players:
                  print(
                      player["slot"],
                      player["name"],
                      "$" + str(player["salary"]),
                      player["projectedPoints"],
                      flush=True
                  )

          print(
              "\n=== FINAL FANDUEL NBA V3 ===",
              flush=True
          )

          print("PASS", flush=True)
          print("Lineups: 10", flush=True)
          print("First lineup: OPTIMAL", flush=True)
          print("Scoring: FanDuel", flush=True)
          print("Injuries: V3", flush=True)
          print("Mode: SHADOW", flush=True)
          print("No database writes", flush=True)
          print("No publication", flush=True)
          PY

      - name: Save FanDuel V3 shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-nba-fanduel-injury-v3
          path: fantasy-fanduel-v3-results/*.json
          if-no-files-found: warn
          retention-days: 7
