
name: NFL Fantasy DST Data Audit

on:
  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nfl-dst-data-audit.yml"

jobs:
  dst-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Inspect NFLverse DST data
        shell: python
        run: |
          import io
          import requests
          import pyarrow.parquet as pq

          BASE = (
              "https://github.com/nflverse/"
              "nflverse-data/releases/download/pbp/"
          )

          SEARCH_TERMS = [
              "sack",
              "interception",
              "fumble",
              "touchdown",
              "safety",
              "blocked",
              "return",
              "score",
              "point",
              "posteam",
              "defteam",
              "game_id",
              "game_date",
              "season",
              "week",
              "play_id"
          ]

          REQUIRED = [
              "game_id",
              "posteam",
              "defteam",
              "play_id"
          ]

          for year in [2025, 2026]:
              url = (
                  BASE +
                  f"play_by_play_{year}.parquet"
              )

              print(f"\n===== NFL {year} =====")

              response = requests.get(
                  url,
                  timeout=120
              )
              response.raise_for_status()

              data = io.BytesIO(response.content)

              parquet = pq.ParquetFile(data)
              columns = parquet.schema_arrow.names

              print("Total columns:", len(columns))
              print(
                  "Total rows:",
                  parquet.metadata.num_rows
              )

              missing = [
                  col for col in REQUIRED
                  if col not in columns
              ]

              print("Required missing:", missing)

              print("\nDST relevant columns:")

              for column in columns:
                  if any(
                      term in column.lower()
                      for term in SEARCH_TERMS
                  ):
                      print(" -", column)

              if missing:
                  raise RuntimeError(
                      f"Required fields missing: {missing}"
                  )

              inspect = [
                  col for col in [
                      "game_id",
                      "season",
                      "week",
                      "game_date",
                      "posteam",
                      "defteam",
                      "play_id",
                      "sack",
                      "interception",
                      "fumble",
                      "touchdown",
                      "safety",
                      "blocked_kick",
                      "total_home_score",
                      "total_away_score"
                  ]
                  if col in columns
              ]

              table = pq.read_table(
                  io.BytesIO(response.content),
                  columns=inspect
              )

              frame = table.to_pandas()

              print("\nSample rows:")
              print(
                  frame.head(5).to_string(
                      index=False
                  )
              )

              print("\nGames:", frame.game_id.nunique())
              print(
                  "Missing offensive team:",
                  int(frame.posteam.isna().sum())
              )
              print(
                  "Missing defensive team:",
                  int(frame.defteam.isna().sum())
              )

          print("\nDST DATA AUDIT COMPLETE")
