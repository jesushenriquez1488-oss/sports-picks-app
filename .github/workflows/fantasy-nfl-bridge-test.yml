
name: CashEdge NFL Fantasy Bridge Test

on:
  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nfl-bridge-test.yml"
      - "fantasy-engine/nfl/stats-bridge.js"

permissions:
  contents: read

jobs:
  nfl-bridge:
    name: NFL Fantasy Real Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check fantasy-engine/nfl/stats-bridge.js

      - name: Verify NFLverse history
        run: node fantasy-engine/nfl/stats-bridge.js
