                  JSON.stringify({
                    sport: "nba",
                    platform: slate.platform,
                    slateId: slate.slateId,
                    capturedAt: new Date().toISOString(),
                    complete: data.complete,
                    pages: data.pages,
                    players: data.players,
                    excluded: data.excluded,
                    salaryConflicts: data.salaryConflicts
                  }, null, 2)
                );

                console.log(
                  `Saved ${data.players.length} players to ${filename}`
                );

                console.log(
                  JSON.stringify(summary, null, 2)
                );

              } catch (error) {
                console.error(
                  `${slate.platform}: ${error.message}`
                );

                results.push({
                  platform: slate.platform,
                  slateId: slate.slateId,
                  complete: false,
                  error: error.message
                });
              }
            }

            console.log("\n=== CASHEDGE NBA DFS SUMMARY ===");

            console.log(
              JSON.stringify(results.map(r => ({
                platform: r.platform,
                slateId: r.slateId,
                complete: r.complete,
                pages: r.pages ?? null,
                uniquePlayers: r.uniquePlayers ?? null,
                excludedEntries: r.excludedEntries ?? null,
                error: r.error ?? null
              })), null, 2)
            );

            if (
              results.length !== 2 ||
              results.some(r =>
                !r.complete ||
                !Number.isInteger(r.uniquePlayers) ||
                r.uniquePlayers === 0
              )
            ) {
              process.exitCode = 1;
              return;
            }

            console.log(
              "CASHEDGE NBA FULL SLATE FETCH PASSED"
            );
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Save NBA slate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-nba-real-slates
          path: fantasy-slate-data/*.json
          if-no-files-found: warn
          retention-days: 1

  real-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: NBA NFL Real Data Shadow

    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase client
        run: |
          npm install --prefix fantasy-engine --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2

      - name: Run NBA NFL real shadow test
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_ANON_KEY: ${{ secrets.FANTASY_SUPABASE_ANON_KEY }}
        run: |
          node fantasy-engine/tests/real-shadow.js
