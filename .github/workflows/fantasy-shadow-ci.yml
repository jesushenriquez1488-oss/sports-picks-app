
name: Fantasy Edge Shadow Tests

on:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/**"
      - ".github/workflows/fantasy-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fantasy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          find fantasy-engine -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Test NBA NFL and simulations
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const { scoreNBA } =
            require("./fantasy-engine/nba/scoring");

          const { scoreNFLOffense } =
            require("./fantasy-engine/nfl/scoring");

          const { simulateFantasySlate } =
            require("./fantasy-engine/shared/simulator");

          const { getContestConfig } =
            require("./fantasy-engine/shared/contest-config");

          const { runFantasyShadowPreview } =
            require("./fantasy-engine/shared/shadow-preview");

          const nbaStats = {
            points: 20,
            rebounds: 12,
            assists: 11,
            steals: 1,
            blocks: 0,
            turnovers: 2,
            three_pointers_made: 2
          };

          assert.equal(
            scoreNBA(nbaStats, "draftkings").points,
            56.5
          );

          assert.equal(
            scoreNBA(nbaStats, "fanduel").points,
            51.9
          );

          const nflStats = {
            passing_yards: 300,
            passing_tds: 2,
            passing_interceptions: 1,
            rushing_yards: 20,
            rushing_tds: 0,
            receptions: 0,
            receiving_yards: 0,
            receiving_tds: 0,
            fumbles_lost: 0,
            two_point_conversions: 0,
            return_tds: 0,
            offensive_fumble_recovery_tds: 0
          };

          for (const platform of ["draftkings", "fanduel"]) {
            assert.equal(
              scoreNFLOffense(nflStats, platform).points,
              24
            );
          }

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {
              const config = getContestConfig({
                sport,
                platform
              });

              assert.equal(
                config.salaryCap,
                platform === "draftkings" ? 50000 : 60000
              );

              assert.equal(
                config.rosterSize,
                sport === "nba" && platform === "draftkings"
                  ? 8
                  : 9
              );
            }
          }

          const nbaHistory = Array.from(
            { length: 12 },
            (_, i) => ({
              game_id: i + 1,
              player_id: 77,
              game_date:
                `2026-01-${String(i + 1).padStart(2, "0")}T00:00:00Z`,
              minutes: 30,
              ...nbaStats
            })
          );

          const nflLogs = Array.from(
            { length: 8 },
            (_, i) => ({
              gameId: String(i + 100),
              date:
                `2026-09-${String(i + 10).padStart(2, "0")}T00:00:00Z`,
              passing: {
                attempts: 30,
                yards: 250,
                touchdowns: 2,
                interceptions: 1
              },
              rushing: {
                attempts: 3,
                yards: 15,
                touchdowns: 0
              },
              receiving: {
                targets: 0,
                receptions: 0,
                yards: 0,
                touchdowns: 0
              }
            })
          );

          const mockDb = {
            from() {
              return {
                filters: {},
                select() { return this; },
                eq(key, value) {
                  this.filters[key] = value;
                  return this;
                },
                in() { return this; },
                lt() { return this; },
                order() { return this; },
                async limit() {
                  return {
                    data: nbaHistory,
                    error: null
                  };
                },
                async maybeSingle() {
                  return {
                    data: this.filters.season === 2026
                      ? { stats_json: { logs: nflLogs } }
                      : null,
                    error: null
                  };
                }
              };
            }
          };

          async function testPreviews() {
            const cutoffAt = "2026-10-20T18:00:00Z";

            const nba = await runFantasyShadowPreview({
              db: mockDb,
              sport: "nba",
              platform: "draftkings",
              cutoffAt,
              players: [{ id: 77 }]
            });

            const nfl = await runFantasyShadowPreview({
              db: mockDb,
              sport: "nfl",
              platform: "fanduel",
              cutoffAt,
              players: [{
                id: "900",
                position: "QB"
              }]
            });

            assert.equal(nba.counts.projected, 1);
            assert.equal(nfl.counts.projected, 1);

            assert.equal(nba.counts.errors, 0);
            assert.equal(nfl.counts.errors, 0);

            assert.equal(
              nfl.results[0].fantasyBasePoints,
              null
            );

            console.log("OK: NBA y NFL shadow preview");
          }

          function testSimulations() {
            const options = {
              platform: "draftkings",
              players: [{ id: "A" }, { id: "B" }],
              lineups: [{
                id: "lineup-1",
                playerIds: ["A", "B"]
              }],
              iterations: 10000,
              seed: "fantasy-ci-test",
              scoreStats: scoreNBA,
              generateScenario({ random }) {
                const variation = random() < 0.5 ? 5 : 0;

                return {
                  A: {
                    ...nbaStats,
                    points: nbaStats.points + variation
                  },
                  B: {
                    ...nbaStats,
                    points: nbaStats.points + variation
                  }
                };
              }
            };

            const first = simulateFantasySlate(options);
            const second = simulateFantasySlate(options);

            assert.deepEqual(first, second);
            assert.equal(first.iterations, 10000);

            assert.ok(
              first.lineups[0].p90 >
              first.lineups[0].p10
            );

            assert.ok(
              Math.abs(
                first.lineups[0].standardDeviation -
                2 * first.players[0].standardDeviation
              ) < 0.03
            );

            console.log("OK: 10000 escenarios reproducibles");
          }

          (async () => {
            await testPreviews();
            testSimulations();
            console.log("FANTASY EDGE: TESTS PASSED");
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Test NBA injury bridge
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            prepareNBAInjuryShadowPlayers
          } = require("./fantasy-engine/shared/dfs-provider");

          const {
            buildNBAInjuryContext
          } = require("./fantasy-engine/nba/injury-context");

          const cutoffAt = "2026-10-20T18:00:00Z";

          // Partido y jugadores simulados.
          // Identificadores compatibles con NBA.

          const slate = {
            sport: "nba",
            events: [{
              id: 51,
              startsAt: "2026-10-20T23:00:00Z"
            }],
            draftables: [
              {
                entityType: "player",
                eventId: 51,
                playerId: 383,
                teamId: 9,
                name: "Jugador A"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 44,
                teamId: 9,
                name: "Jugador B"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 42,
                teamId: 2,
                name: "Jugador C"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 45,
                teamId: 2,
                name: "Jugador D"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 383,
                teamId: 9,
                name: "Jugador A"
              }
            ]
          };

          const snapshot = {
            game_id: "nba-test-Boston-Detroit",
            away_team_id: 2,
            home_team_id: 9,
            game_time: "2026-10-20T23:00:00Z",
            checked_at: "2026-10-20T16:00:00Z",
            provider: "balldontlie",
            injuries: [
              {
                player_id: "383",
                team_id: "9",
                status: "out"
              },
              {
                player_id: "42",
                team_id: "2",
                status: "day-to-day"
              }
            ]
          };

          const linked =
            prepareNBAInjuryShadowPlayers({
              slate,
              injurySnapshots: [snapshot],
              cutoffAt
            });

          assert.equal(linked.players.length, 4);
          assert.equal(linked.matchedPlayers, 4);
          assert.equal(linked.unverifiedPlayers, 0);

          const checkPlayer = (playerId, teamId) =>
            buildNBAInjuryContext({
              snapshot,
              cutoffAt,
              playerId,
              teamId
            });

          // Confirmado OUT.

          const out = checkPlayer("383", "9");

          assert.equal(out.usable, true);
          assert.equal(out.playerStatus, "out");

          // Compañero del lesionado.

          const teammate = checkPlayer("44", "9");

          assert.equal(
            teammate.ruledOutTeammates.length,
            1
          );

          // Jugador incierto.

          const uncertain = checkPlayer("42", "2");

          assert.equal(
            uncertain.playerStatus,
            "uncertain"
          );

          // Reporte posterior a la prediccion.

          const future =
            prepareNBAInjuryShadowPlayers({
              slate,
              cutoffAt,
              injurySnapshots: [{
                ...snapshot,
                checked_at: "2026-10-20T19:00:00Z"
              }]
            });

          assert.equal(future.matchedPlayers, 0);

          // Equipos incorrectos.

          const mismatch =
            prepareNBAInjuryShadowPlayers({
              slate,
              cutoffAt,
              injurySnapshots: [{
                ...snapshot,
                home_team_id: 99
              }]
            });

          assert.equal(mismatch.matchedPlayers, 0);

          console.log("NBA INJURY BRIDGE: OK");
          NODE

  dfs-diagnostic-tests:
    name: BALLDONTLIE DFS Diagnostic Tests
    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test DFS diagnostic with mock API
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            auditDfsFeed,
            auditDfsMatrix
          } = require("./fantasy-engine/shared/dfs-diagnostic");

          const slots = [
            "PG", "SG", "SF", "PF",
            "C", "G", "F", "UTIL"
          ];

          let calls = [];

          async function fakeFetch(url, options) {
            const u = new URL(url);

            calls.push({
              path: u.pathname,
              provider: u.searchParams.get("providers[]"),
              auth: options.headers.Authorization
            });

            const response = data => ({
              ok: true,
              status: 200,
              json: async () => data
            });

            if (u.pathname.endsWith("/dfs/slates")) {
              return response({
                data: [{
                  id: 123,
                  sport: "nba",
                  provider: "draftkings",
                  format: "salary_cap",
                  scope: "multi_event",
                  style: "classic",
                  starts_at: "2026-10-21T23:00:00Z"
                }],
                meta: { next_cursor: null }
              });
            }

            if (u.pathname.endsWith("/dfs/slates/123")) {
              return response({
                data: {
                  id: 123,
                  sport: "nba",
                  provider: "draftkings",
                  format: "salary_cap",
                  scope: "multi_event",
                  style: "classic",
                  salary_cap: 50000,
                  starts_at: "2026-10-21T23:00:00Z",
                  events: [{
                    id: 50,
                    game_id: 900,
                    starts_at: "2026-10-21T23:00:00Z"
                  }],
                  roster_slots: slots.map((name, i) => ({
                    id: i + 1,
                    name,
                    required_count: 1,
                    active: true
                  }))
                }
              });
            }

            if (u.pathname.endsWith("/dfs/draftables")) {
              return response({
                data: [
                  {
                    id: 1,
                    entity_type: "player",
                    player_id: 77,
                    team_id: 2,
                    game_id: 900,
                    slate_event_id: 50,
                    display_name: "Test Player",
                    position: "PG",
                    salary: 7500,
                    roster_slot_id: 1
                  },
                  {
                    id: 2,
                    entity_type: "player",
                    player_id: 77,
                    team_id: 2,
                    game_id: 900,
                    slate_event_id: 50,
                    display_name: "Test Player",
                    position: "PG",
                    salary: 7600,
                    roster_slot_id: 6
                  }
                ],
                meta: { next_cursor: null }
              });
            }

            throw new Error("Unexpected endpoint: " + u.pathname);
          }

          async function main() {
            const result = await auditDfsFeed({
              sport: "nba",
              platform: "draftkings",
              startDate: "2026-10-21",
              apiKey: "TEST_ONLY_KEY",
              fetchFn: fakeFetch
            });

            assert.equal(result.accessConfirmed, true);
            assert.equal(result.classicSlateFound, true);
            assert.equal(result.requests, 3);
            assert.equal(result.slate.salaryCap, 50000);
            assert.equal(result.slate.rosterSize, 8);

            assert.equal(
              result.checks.salaryCapMatchesClassic,
              true
            );

            assert.equal(
              result.checks.rosterSizeMatchesClassic,
              true
            );

            assert.equal(result.firstPage.draftables, 2);
            assert.equal(result.firstPage.uniqueEntities, 1);
            assert.equal(
              result.firstPage.salaryConflicts.length,
              1
            );

            assert.equal(calls.length, 3);

            assert.ok(
              calls.every(call =>
                call.auth === "TEST_ONLY_KEY"
              )
            );

            console.log("NBA DFS MOCK: PASS");
            console.log("SALARY CONFLICT DETECTION: PASS");
            console.log("SLATE AND ROSTER VALIDATION: PASS");
            console.log("REQUEST COUNT: 3");

            // Comprobar que la matriz exportada existe.
            assert.equal(typeof auditDfsMatrix, "function");

            console.log("DFS MATRIX EXPORT: PASS");
            console.log("DFS DIAGNOSTIC TESTS PASSED");
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  optimizer-tests:
    name: Fantasy Lineup Optimizer Tests
    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test lineup optimizer
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            optimizeFantasyLineup
          } = require("./fantasy-engine/shared/lineup-optimizer");

          const {
            getContestConfig,
            validateClassicLineup
          } = require("./fantasy-engine/shared/contest-config");

          function makePool(sport) {
            const positions = sport === "nba"
              ? [
                  "PG", "PG", "PG",
                  "SG", "SG", "SG",
                  "SF", "SF", "SF",
                  "PF", "PF", "PF",
                  "C", "C"
                ]
              : [
                  "QB", "QB",
                  "RB", "RB", "RB",
                  "WR", "WR", "WR", "WR",
                  "TE", "TE",
                  "DST", "DST"
                ];

            return positions.map((position, i) => ({
              playerId: `P${i + 1}`,
              name: `Test Player ${i + 1}`,
              position,
              teamId: `T${i % 6}`,
              gameId: `G${i % 3}`,
              salary: 4500,
              projectedPoints: 15 + i
            }));
          }

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {

              const config = getContestConfig({
                sport,
                platform
              });

              const slate = {
                id: "test-slate",
                sport,
                platform,
                format: "classic",
                gameIds: ["G0", "G1", "G2"]
              };

              const players = makePool(sport);

              const run = options =>
                optimizeFantasyLineup({
                  sport,
                  platform,
                  slate,
                  players,
                  ...options
                });

              // Alineacion completa.

              const result = run();

              assert.equal(result.found, true);
              assert.equal(result.mode, "shadow");
              assert.equal(result.contestVerified, false);
              assert.equal(result.readyForPublication, false);
              assert.equal(result.optimalityGuaranteed, false);

              assert.equal(
                result.lineup.length,
                config.rosterSize
              );

              assert.ok(
                result.salary <= config.salaryCap
              );

              const ids = result.lineup.map(
                p => p.playerId
              );

              assert.equal(
                new Set(ids).size,
                config.rosterSize
              );

              const validation = validateClassicLineup({
                sport,
                platform,
                slate,
                lineup: result.lineup
              });

              assert.equal(
                validation.structurallyValid,
                true
              );

              // Bloquear un jugador.

              const lockedId = "P1";

              const locked = run({
                locked: [lockedId]
              });

              assert.equal(locked.found, true);

              assert.ok(
                locked.lineup.some(
                  p => p.playerId === lockedId
                )
              );

              // Excluir un jugador.

              const excluded = run({
                excluded: [lockedId]
              });

              assert.equal(excluded.found, true);

              assert.ok(
                excluded.lineup.every(
                  p => p.playerId !== lockedId
                )
              );

              // Bloqueo y exclusion simultaneos.

              assert.throws(
                () => run({
                  locked: [lockedId],
                  excluded: [lockedId]
                }),
                /bloqueado y excluido/
              );

              // Presupuesto insuficiente.

              const expensive = run({
                players: players.map(p => ({
                  ...p,
                  salary: config.salaryCap
                }))
              });

              assert.equal(
                expensive.found,
                false
              );

              console.log(
                `OK ${sport.toUpperCase()} ${platform}`
              );
            }
          }

          console.log(
            "FANTASY LINEUP OPTIMIZER: ALL TESTS PASSED"
          );
          NODE

  exact-optimizer-tests:
    name: Exact Mathematical Optimizer
    needs: optimizer-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test exact optimization
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            optimizeFantasyLineupExact
          } = require("./fantasy-engine/shared/lineup-optimizer");

          const {
            getContestConfig,
            validateClassicLineup
          } = require("./fantasy-engine/shared/contest-config");

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {

              const config = getContestConfig({
                sport,
                platform
              });

              const slate = {
                id: "exact-test",
                sport,
                platform,
                format: "classic",
                gameIds: ["G1", "G2"]
              };

              // Crear una alineacion de referencia
              // con todas las posiciones cubiertas.

              const basePositions = sport === "nba"
                ? platform === "draftkings"
                  ? ["PG", "SG", "SF", "PF",
                     "C", "PG", "SF", "C"]
                  : ["PG", "PG", "SG", "SG",
                     "SF", "SF", "PF", "PF", "C"]
                : ["QB", "RB", "RB", "WR",
                   "WR", "WR", "TE", "RB", "DST"];

              const players = basePositions.map(
                (position, i) => ({
                  playerId: `BASE${i}`,
                  name: `Base ${i}`,
                  positions: [position],
                  salary: 4500,
                  projectedPoints: 20 + i,
                  gameId: i % 2 ? "G1" : "G2",
                  teamId: `TEAM${i % 4}`
                })
              );

              const baseTotal = players.reduce(
                (sum, p) => sum + p.projectedPoints,
                0
              );

              // Alternativa mas barata pero
              // con menor proyeccion.

              players.push({
                playerId: "EXTRA",
                positions: ["PG"].filter(
                  () => sport === "nba"
                ).concat(
                  sport === "nfl" ? ["QB"] : []
                ),
                salary: 4000,
                projectedPoints: 5,
                gameId: "G1",
                teamId: "EXTRA_TEAM"
              });

              const run = options =>
                optimizeFantasyLineupExact({
                  sport,
                  platform,
                  slate,
                  players,
                  maxNodes: 2000000,
                  ...options
                });

              // Debe demostrar la mejor solucion,
              // no solamente encontrar una.

              const result = run();

              assert.equal(result.found, true);
              assert.equal(
                result.optimalityGuaranteed,
                true
              );
              assert.equal(
                result.nodeLimitReached,
                false
              );
              assert.equal(
                result.lineup.length,
                config.rosterSize
              );
              assert.equal(
                result.projectedPoints,
                baseTotal
              );

              assert.ok(
                result.lineup.every(
                  p => p.playerId !== "EXTRA"
                )
              );

              assert.equal(
                validateClassicLineup({
                  sport,
                  platform,
                  slate,
                  lineup: result.lineup
                }).structurallyValid,
                true
              );

              // Jugador obligatorio.

              const locked = run({
                locked: ["EXTRA"]
              });

              assert.equal(locked.found, true);
              assert.equal(
                locked.optimalityGuaranteed,
                true
              );

              assert.ok(
                locked.lineup.some(
                  p => p.playerId === "EXTRA"
                )
              );

              // Exclusion del jugador alternativo.

              const excluded = run({
                excluded: ["EXTRA"]
              });

              assert.equal(excluded.found, true);
              assert.equal(
                excluded.optimalityGuaranteed,
                true
              );

              assert.equal(
                excluded.projectedPoints,
                baseTotal
              );

              // Si la busqueda se interrumpe,
              // NO puede afirmar optimalidad.

              const interrupted = run({
                maxNodes: 1
              });

              assert.equal(
                interrupted.optimalityGuaranteed,
                false
              );

              assert.equal(
                interrupted.nodeLimitReached,
                true
              );

              // Sin jugadores suficientes,
              // demostrar que no hay alineacion.

              const impossible = run({
                players: players.slice(0, 2)
              });

              assert.equal(impossible.found, false);
              assert.equal(
                impossible.provenInfeasible,
                true
              );

              console.log(
                `EXACT OK: ${sport.toUpperCase()} ${platform}`
              );
              console.log(
                `Nodes visited: ${result.nodesVisited}`
              );
            }
          }

          console.log(
            "EXACT OPTIMIZER: ALL TESTS PASSED"
          );
          NODE

  optimizer-load-test:
    name: Exact Optimizer Load Test
    needs: exact-optimizer-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Benchmark 150 players
        run: |
          node <<'NODE'
          const {
            optimizeFantasyLineupExact
          } = require("./fantasy-engine/shared/lineup-optimizer");

          const groups = {
            nba: ["PG", "SG", "SF", "PF", "C"],
            nfl: ["QB", "RB", "WR", "TE", "DST"]
          };

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {
              const players = Array.from(
                { length: 150 },
                (_, i) => ({
                  playerId: `P${i}`,
                  position: groups[sport][i % 5],
