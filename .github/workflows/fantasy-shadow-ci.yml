            const url = new URL('https://api.balldontlie.io/nba/v1/dfs/slates');
            url.searchParams.set('providers[]', platform);
            url.searchParams.set('formats[]', 'salary_cap');
            url.searchParams.set('scopes[]', 'multi_event');
            url.searchParams.set('start_date', new Date(now).toISOString().slice(0, 10));
            url.searchParams.set('per_page', '100');

            for (let attempt = 1; attempt <= 3; attempt++) {
              const response = await fetch(url, {
                headers: { Authorization: key },
                signal: AbortSignal.timeout(15000)
              });
              if (response.status === 429 && attempt < 3) {
                console.log(`${platform}: HTTP 429; waiting 75 seconds`);
                await sleep(75000);
                continue;
              }
              if (!response.ok) {
                throw Error(`${platform}: slates HTTP ${response.status}`);
              }
              const body = await response.json();
              if (!Array.isArray(body.data)) {
                throw Error(`${platform}: invalid slate listing`);
              }
              const styleWanted = platform === 'draftkings' ? 'classic' : 'full roster';
              const matches = body.data.filter(s =>
                s.provider === platform &&
                s.sport === 'nba' &&
                s.format === 'salary_cap' &&
                s.scope === 'multi_event' &&
                String(s.style || '').trim().toLowerCase() === styleWanted &&
                Number.isFinite(Date.parse(s.starts_at)) &&
                Date.parse(s.starts_at) > now
              ).sort((a,b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
              return matches[0] || null;
            }
            return null;
          }

          async function main() {
            if (!key) throw Error('Missing NBA GOAT GitHub secret');
            fs.mkdirSync('fantasy-slate-data', { recursive: true });
            let successes = 0;
            for (const platform of ['draftkings', 'fanduel']) {
              try {
                const slate = await findUpcomingSlate(platform);
                if (!slate) {
                  console.log(`${platform}: no future full-roster slate found`);
                  continue;
                }
                console.log(`NEXT ${platform}: slate ${slate.id}, ${slate.starts_at}`);
                await sleep(15000);
                const data = await fetchFullDfsDraftables({
                  sport: 'nba', platform, slateId: slate.id,
                  apiKey: key, waitMs: 15000, maxPages: 20
                });
                if (!data.complete || !data.players.length) {
                  console.log(`${platform}: no eligible players; slate not saved`);
                  continue;
                }
                const filename = `fantasy-slate-data/nba-${platform}-${slate.id}.json`;
                fs.writeFileSync(filename, JSON.stringify({
                  sport: 'nba', platform, slateId: slate.id,
                  startsAt: slate.starts_at, capturedAt: new Date().toISOString(),
                  complete: data.complete, pages: data.pages,
                  players: data.players, excluded: data.excluded,
                  salaryConflicts: data.salaryConflicts
                }, null, 2));
                console.log(`Saved ${data.players.length} players to ${filename}`);
                successes++;
              } catch (error) {
                console.error(`${platform}: ${error.message}`);
              }
              await sleep(15000);
            }
            console.log(`CASHEDGE NBA SLATES SAVED: ${successes}/2`);
            if (successes !== 2) process.exitCode = 1;
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Save NBA slate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-nba-real-slates
          path: fantasy-slate-data/*.json
          if-no-files-found: warn
          retention-days: 7

  real-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: NBA NFL Real Data Shadow
    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase client
        run: npm install --prefix fantasy-engine --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2

      - name: Run NBA NFL real shadow test
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_ANON_KEY: ${{ secrets.FANTASY_SUPABASE_ANON_KEY }}
        run: node fantasy-engine/tests/real-shadow.js
