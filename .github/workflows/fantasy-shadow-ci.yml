  multi-lineup-tests:
    name: CP-SAT Multiple Lineups
    needs: cpsat-optimizer-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OR-Tools
        run: |
          python -m pip install "ortools>=9.10,<10"

      - name: Test multiple lineups
        run: |
          python - <<'PY'
          import sys
          from collections import Counter

          sys.path.insert(
              0, "fantasy-engine/optimizer"
          )

          from multi_solver import optimize_multiple
          from solver import RULES

          def make_players(sport):
              positions = (
                  ["PG", "SG", "SF", "PF", "C"]
                  if sport == "nba"
                  else ["QB", "RB", "WR", "TE", "DST"]
              )

              return [
                  {
                      "playerId": f"P{i}",
                      "name": f"Player {i}",
                      "positions": [
                          positions[i % 5]
                      ],
                      "salary": 3500 + (i * 137 % 30) * 100,
                      "projectedPoints": round(
                          12 + (i * 19 % 36)
                          + (i % 5) * 0.13,
                          2
                      ),
                      "gameId": f"G{i % 8}",
                      "teamId": f"T{i % 16}"
                  }
                  for i in range(100)
              ]

          def test(sport, platform, count):
              config = RULES[sport][platform]

              players = make_players(sport)
              by_id = {
                  p["playerId"]: p
                  for p in players
              }

              # Tres alineaciones: probar locks.
              # Cinco y diez: exposicion al 60%.

              exposure = 100 if count == 3 else 60
              locked = ["P0"] if count == 3 else []

              result = optimize_multiple({
                  "sport": sport,
                  "platform": platform,
                  "slate": {
                      "id": "multi-test",
                      "sport": sport,
                      "platform": platform,
                      "format": "classic",
                      "gameIds": [
                          f"G{i}" for i in range(8)
                      ]
                  },
                  "players": players,
                  "lineupCount": count,
                  "maxExposurePercent": exposure,
                  "minDifferentPlayers": 2,
                  "locked": locked,
                  "excluded": ["P99"],
                  "timeLimitSeconds": 12
              })

              print(
                  f"{sport.upper()} "
                  f"{platform.upper()} "
                  f"{count} LINEUPS",
                  flush=True
              )
              print(
                  "Status:", result["status"],
                  flush=True
              )
              print(
                  "Optimal proven:",
                  result["optimalityGuaranteed"],
                  flush=True
              )
              print(
                  "Time:",
                  result["wallTimeSeconds"],
                  flush=True
              )

              assert result["found"], result
              assert len(result["lineups"]) == count

              appearances = Counter()
              lineup_sets = []

              for lineup in result["lineups"]:
                  chosen = lineup["players"]

                  assert len(chosen) == len(
                      config["slots"]
                  )

                  ids = [
                      p["playerId"]
                      for p in chosen
                  ]

                  assert len(ids) == len(set(ids))
                  assert "P99" not in ids

                  for pid in locked:
                      assert pid in ids

                  assert lineup["salary"] <= (
                      config["salary_cap"]
                  )

                  assert {
                      p["slot"] for p in chosen
                  } == set(config["slots"])

                  for p in chosen:
                      original = by_id[p["playerId"]]

                      assert p["salary"] == (
                          original["salary"]
                      )

                      assert set(
                          p["positions"]
                      ).intersection(
                          config["slots"][p["slot"]]
                      )

                      appearances[p["playerId"]] += 1

                  lineup_sets.append(set(ids))

              max_allowed = count * exposure // 100

              assert all(
                  n <= max_allowed
                  for n in appearances.values()
              )

              for a in range(count):
                  for b in range(a + 1, count):
                      difference = len(
                          lineup_sets[a] -
                          lineup_sets[b]
                      )
                      assert difference >= 2

              assert result["status"] in (
                  "OPTIMAL", "FEASIBLE"
              )

              if result["status"] == "OPTIMAL":
                  assert result["optimalityGuaranteed"]
              else:
                  assert not result["optimalityGuaranteed"]

              print(
                  "Total projected:",
                  result["totalProjectedPoints"],
                  flush=True
              )
              print("VALIDATION: PASS", flush=True)
              print("--------------------", flush=True)

          for sport in ("nba", "nfl"):
              for platform in (
                  "draftkings", "fanduel"
              ):
                  test(sport, platform, 3)
                  test(sport, platform, 5)

          # Probar 10 alineaciones en ambos deportes.
          test("nba", "draftkings", 10)
          test("nfl", "fanduel", 10)

          print(
              "MULTI-LINEUP TESTS COMPLETE",
              flush=True
          )
          PY

  optimizer-comparison:
    name: Compare Joint vs Sequential CP-SAT
    needs: cpsat-optimizer-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OR-Tools
        run: |
          python -m pip install "ortools>=9.10,<10"

      - name: Compare multi-lineup strategies
        run: |
          python - <<'PY'
          import sys
          import time
          import json
          from collections import Counter

          sys.path.insert(
              0, "fantasy-engine/optimizer"
          )

          from multi_solver import optimize_multiple
          from sequential_solver import solve_sequential
          from solver import RULES

          def build_players(sport):
              positions = (
                  ["PG", "SG", "SF", "PF", "C"]
                  if sport == "nba"
                  else ["QB", "RB", "WR", "TE", "DST"]
              )

              return [
                  {
                      "playerId": f"P{i}",
                      "name": f"Player {i}",
                      "positions": [positions[i % 5]],
                      "salary": 3500 + (i * 137 % 30) * 100,
                      "projectedPoints": round(
                          12 + (i * 19 % 36)
                          + (i % 5) * 0.13, 2
                      ),
                      "gameId": f"G{i % 8}",
                      "teamId": f"T{i % 16}"
                  }
                  for i in range(100)
              ]

          def verify(result, payload):
              count = payload["lineupCount"]

              if len(result["lineups"]) != count:
                  return False

              rules = RULES[
                  payload["sport"]
              ][payload["platform"]]

              slots = rules["slots"]
              exposure = Counter()
              previous = []

              for lineup in result["lineups"]:
                  players = lineup["players"]
                  ids = [p["playerId"] for p in players]

                  if (
                      len(players) != len(slots)
                      or len(ids) != len(set(ids))
                      or lineup["salary"] >
                         rules["salary_cap"]
                      or {p["slot"] for p in players}
                         != set(slots)
                  ):
                      return False

                  for player in players:
                      if not (
                          set(player["positions"])
                          & set(slots[player["slot"]])
                      ):
                          return False

                      exposure[player["playerId"]] += 1

                  selected = set(ids)

                  if any(
                      len(selected - old) <
                      payload["minDifferentPlayers"]
                      for old in previous
                  ):
                      return False

                  previous.append(selected)

              maximum = (
                  count *
                  payload["maxExposurePercent"]
                  // 100
              )

              return all(
                  occurrences <= maximum
                  for occurrences in exposure.values()
              )

          cases = [
              ("nba", "draftkings", 3),
              ("nba", "fanduel", 5),
              ("nfl", "draftkings", 5),
              ("nfl", "fanduel", 10),
          ]

          for sport, platform, count in cases:
              payload = {
                  "sport": sport,
                  "platform": platform,
                  "slate": {
                      "id": "strategy-comparison",
                      "sport": sport,
                      "platform": platform,
                      "format": "classic",
                      "gameIds": [
                          f"G{i}" for i in range(8)
                      ]
                  },
                  "players": build_players(sport),
                  "lineupCount": count,
                  "maxExposurePercent": (
                      100 if count == 3 else 60
                  ),
                  "minDifferentPlayers": 2,
                  "locked": [],
                  "excluded": ["P99"],
              }

              joint_input = {
                  **payload,
                  "timeLimitSeconds": 10,
              }

              sequential_input = {
                  **payload,
                  "timeLimitSeconds": 2,
              }

              start = time.perf_counter()
              joint = optimize_multiple(joint_input)
              joint_elapsed = time.perf_counter() - start

              start = time.perf_counter()
              sequential = solve_sequential(
                  sequential_input
              )
              seq_elapsed = time.perf_counter() - start

              joint_valid = (
                  joint.get("found") is True
                  and verify(joint, payload)
              )

              seq_valid = (
                  sequential.get("found") is True
                  and verify(sequential, payload)
              )

              report = {
                  "sport": sport,
                  "platform": platform,
                  "lineupCount": count,
                  "joint": {
                      "status": joint["status"],
                      "valid": joint_valid,
                      "optimalProven":
                          joint["optimalityGuaranteed"],
                      "seconds": round(
                          joint_elapsed, 3
                      ),
                      "totalPoints":
                          joint.get("totalProjectedPoints")
                  },
                  "sequential": {
                      "status": sequential["status"],
                      "valid": seq_valid,
                      "allStepsOptimal":
                          sequential["allStepOptimal"],
                      "globalOptimalProven":
                          sequential[
                              "globalOptimalityGuaranteed"
                          ],
                      "seconds": round(
                          seq_elapsed, 3
                      ),
                      "totalPoints":
                          sequential["totalProjectedPoints"]
                  }
              }

              print(
                  json.dumps(report, indent=2),
                  flush=True
              )

              assert joint_valid, (
                  "Conjunto invalido: "
                  + sport + " " + platform
              )

              assert seq_valid, (
                  "Secuencial invalido: "
                  + sport + " " + platform
              )

          print(
              "OPTIMIZER COMPARISON COMPLETE",
              flush=True
          )
          PY

  recommendation-controller-tests:
    name: CashEdge Recommended Lineup Certification
    needs: cpsat-optimizer-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OR-Tools
        run: |
          python -m pip install "ortools>=9.10,<10"

      - name: Test primary and alternative lineups
        run: |
          python - <<'PY'
          import sys
          from collections import Counter

          sys.path.insert(
              0, "fantasy-engine/optimizer"
          )

          from solver import optimize, RULES
          from recommendation_controller import recommend

          def make_players(sport):
              positions = (
                  ["PG", "SG", "SF", "PF", "C"]
                  if sport == "nba"
                  else ["QB", "RB", "WR", "TE", "DST"]
              )

              return [
                  {
                      "playerId": f"P{i}",
                      "name": f"Player {i}",
                      "positions": [positions[i % 5]],
                      "salary": 3500 + (i % 15) * 200,
                      "projectedPoints": round(
                          12 + (i * 17 % 34)
                          + (i % 7) / 10, 2
                      ),
                      "gameId": f"G{i % 8}",
                      "teamId": f"T{i % 16}"
                  }
                  for i in range(100)
              ]

          def run_case(sport, platform):
              players = make_players(sport)

              slate = {
                  "id": "certification-test",
                  "sport": sport,
                  "platform": platform,
                  "format": "classic",
                  "gameIds": [
                      f"G{i}" for i in range(8)
                  ]
              }

              base = {
                  "sport": sport,
                  "platform": platform,
                  "slate": slate,
                  "players": players,
                  "locked": [],
                  "excluded": ["P99"],
                  "timeLimitSeconds": 12
              }

              # Solucion matematica individual.
              direct = optimize(base)

              assert direct["status"] == "OPTIMAL"
              assert direct["found"]

              expected = {
                  p["playerId"]
                  for p in direct["lineup"]
              }

              # Controlador con una sola alineacion.
              single = recommend({
                  **base,
                  "lineupCount": 1,
                  "maxExposurePercent": 100
              })

              assert single["status"] == "COMPLETE"
              assert single["mainOptimalityGuaranteed"]

              # Puede haber empates optimos.
              # Verificamos valor objetivo y
              # validez, no IDs necesariamente.
              assert abs(
                  single["recommended"]["projectedPoints"]
                  - direct["projectedPoints"]
              ) < 0.0001

              print(
                  f"{sport.upper()} {platform.upper()}",
                  flush=True
              )
              print(
                  "MAIN OPTIMAL: PASS",
                  flush=True
              )

              # Misma principal con 3 alineaciones.
              multi = recommend({
                  **base,
                  "lineupCount": 3,
                  "maxExposurePercent": 100,
                  "minDifferentPlayers": 2
              })

              assert multi["mainOptimalityGuaranteed"]
              assert multi["recommended"]["status"] == "OPTIMAL"

              main_ids = {
                  p["playerId"]
                  for p in multi["recommended"]["players"]
              }

              assert main_ids == expected

              assert abs(
                  multi["recommended"]["projectedPoints"]
                  - direct["projectedPoints"]
              ) < 0.0001

              assert multi["status"] == "COMPLETE"
              assert len(multi["alternatives"]) == 2

              print(
                  "MAIN UNCHANGED: PASS",
                  flush=True
              )

              # Verificar alternativas.
              rules = RULES[sport][platform]
              all_lineups = [
                  multi["recommended"],
                  *multi["alternatives"]
              ]

              seen_lineups = []
              appearances = Counter()

              for lineup in all_lineups:
                  chosen = lineup["players"]
                  ids = [p["playerId"] for p in chosen]

                  assert len(chosen) == len(rules["slots"])
                  assert len(ids) == len(set(ids))
                  assert lineup["salary"] <= rules["salary_cap"]

                  assert {
                      p["slot"] for p in chosen
                  } == set(rules["slots"])

                  for p in chosen:
                      assert set(
                          p["positions"]
                      ) & set(
                          rules["slots"][p["slot"]]
                      )
                      appearances[p["playerId"]] += 1

                  current = set(ids)

                  for previous in seen_lineups:
                      assert len(
                          current - previous
                      ) >= 2

                  seen_lineups.append(current)

              assert len(seen_lineups) == 3

              print(
                  "ALTERNATIVES VALID: PASS",
                  flush=True
              )

              # Exposicion al 60%:
              # 3 alineaciones = maximo 1
              # aparicion por jugador.
              limited = recommend({
                  **base,
                  "lineupCount": 3,
                  "maxExposurePercent": 60,
                  "minDifferentPlayers": 2
              })

              assert limited["mainOptimalityGuaranteed"]
              assert limited["status"] == "COMPLETE"
              assert limited["maxAppearances"] == 1

              assert {
                  p["playerId"]
                  for p in limited["recommended"]["players"]
              } == expected

              assert all(
                  row["appearances"] <= 1
                  for row in limited["playerExposure"]
              )

              print(
                  "EXPOSURE 60%: PASS",
                  flush=True
              )
              print("-------------------------", flush=True)

          run_case("nba", "draftkings")
          run_case("nfl", "fanduel")

          print(
              "CASHEDGE RECOMMENDATION TESTS PASSED",
              flush=True
          )
          PY

