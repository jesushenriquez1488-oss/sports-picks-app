
name: Fantasy Edge Shadow Tests

on:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/**"
      - ".github/workflows/fantasy-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fantasy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          find fantasy-engine -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Test NBA NFL and simulations
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const { scoreNBA } =
            require("./fantasy-engine/nba/scoring");

          const { scoreNFLOffense } =
            require("./fantasy-engine/nfl/scoring");

          const { simulateFantasySlate } =
            require("./fantasy-engine/shared/simulator");

          const { getContestConfig } =
            require("./fantasy-engine/shared/contest-config");

          const { runFantasyShadowPreview } =
            require("./fantasy-engine/shared/shadow-preview");

          const nbaStats = {
            points: 20,
            rebounds: 12,
            assists: 11,
            steals: 1,
            blocks: 0,
            turnovers: 2,
            three_pointers_made: 2
          };

          assert.equal(
            scoreNBA(nbaStats, "draftkings").points,
            56.5
          );

          assert.equal(
            scoreNBA(nbaStats, "fanduel").points,
            51.9
          );

          const nflStats = {
            passing_yards: 300,
            passing_tds: 2,
            passing_interceptions: 1,
            rushing_yards: 20,
            rushing_tds: 0,
            receptions: 0,
            receiving_yards: 0,
            receiving_tds: 0,
            fumbles_lost: 0,
            two_point_conversions: 0,
            return_tds: 0,
            offensive_fumble_recovery_tds: 0
          };

          for (const platform of ["draftkings", "fanduel"]) {
            assert.equal(
              scoreNFLOffense(nflStats, platform).points,
              24
            );
          }

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {
              const config = getContestConfig({
                sport,
                platform
              });

              assert.equal(
                config.salaryCap,
                platform === "draftkings" ? 50000 : 60000
              );

              assert.equal(
                config.rosterSize,
                sport === "nba" && platform === "draftkings"
                  ? 8
                  : 9
              );
            }
          }

          const nbaHistory = Array.from(
            { length: 12 },
            (_, i) => ({
              game_id: i + 1,
              player_id: 77,
              game_date:
                `2026-01-${String(i + 1).padStart(2, "0")}T00:00:00Z`,
              minutes: 30,
              ...nbaStats
            })
          );

          const nflLogs = Array.from(
            { length: 8 },
            (_, i) => ({
              gameId: String(i + 100),
              date:
                `2026-09-${String(i + 10).padStart(2, "0")}T00:00:00Z`,
              passing: {
                attempts: 30,
                yards: 250,
                touchdowns: 2,
                interceptions: 1
              },
              rushing: {
                attempts: 3,
                yards: 15,
                touchdowns: 0
              },
              receiving: {
                targets: 0,
                receptions: 0,
                yards: 0,
                touchdowns: 0
              }
            })
          );

          const mockDb = {
            from() {
              return {
                filters: {},
                select() { return this; },
                eq(key, value) {
                  this.filters[key] = value;
                  return this;
                },
                in() { return this; },
                lt() { return this; },
                order() { return this; },
                async limit() {
                  return {
                    data: nbaHistory,
                    error: null
                  };
                },
                async maybeSingle() {
                  return {
                    data: this.filters.season === 2026
                      ? { stats_json: { logs: nflLogs } }
                      : null,
                    error: null
                  };
                }
              };
            }
          };

          async function testPreviews() {
            const cutoffAt = "2026-10-20T18:00:00Z";

            const nba = await runFantasyShadowPreview({
              db: mockDb,
              sport: "nba",
              platform: "draftkings",
              cutoffAt,
              players: [{ id: 77 }]
            });

            const nfl = await runFantasyShadowPreview({
              db: mockDb,
              sport: "nfl",
              platform: "fanduel",
              cutoffAt,
              players: [{
                id: "900",
                position: "QB"
              }]
            });

            assert.equal(nba.counts.projected, 1);
            assert.equal(nfl.counts.projected, 1);

            assert.equal(nba.counts.errors, 0);
            assert.equal(nfl.counts.errors, 0);

            assert.equal(
              nfl.results[0].fantasyBasePoints,
              null
            );

            console.log("OK: NBA y NFL shadow preview");
          }

          function testSimulations() {
            const options = {
              platform: "draftkings",
              players: [{ id: "A" }, { id: "B" }],
              lineups: [{
                id: "lineup-1",
                playerIds: ["A", "B"]
              }],
              iterations: 10000,
              seed: "fantasy-ci-test",
              scoreStats: scoreNBA,
              generateScenario({ random }) {
                const variation = random() < 0.5 ? 5 : 0;

                return {
                  A: {
                    ...nbaStats,
                    points: nbaStats.points + variation
                  },
                  B: {
                    ...nbaStats,
                    points: nbaStats.points + variation
                  }
                };
              }
            };

            const first = simulateFantasySlate(options);
            const second = simulateFantasySlate(options);

            assert.deepEqual(first, second);
            assert.equal(first.iterations, 10000);

            assert.ok(
              first.lineups[0].p90 >
              first.lineups[0].p10
            );

            assert.ok(
              Math.abs(
                first.lineups[0].standardDeviation -
                2 * first.players[0].standardDeviation
              ) < 0.03
            );

            console.log("OK: 10000 escenarios reproducibles");
          }

          (async () => {
            await testPreviews();
            testSimulations();
            console.log("FANTASY EDGE: TESTS PASSED");
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Test NBA injury bridge
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            prepareNBAInjuryShadowPlayers
          } = require("./fantasy-engine/shared/dfs-provider");

          const {
            buildNBAInjuryContext
          } = require("./fantasy-engine/nba/injury-context");

          const cutoffAt = "2026-10-20T18:00:00Z";

          // Partido y jugadores simulados.
          // Identificadores compatibles con NBA.

          const slate = {
            sport: "nba",
            events: [{
              id: 51,
              startsAt: "2026-10-20T23:00:00Z"
            }],
            draftables: [
              {
                entityType: "player",
                eventId: 51,
                playerId: 383,
                teamId: 9,
                name: "Jugador A"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 44,
                teamId: 9,
                name: "Jugador B"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 42,
                teamId: 2,
                name: "Jugador C"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 45,
                teamId: 2,
                name: "Jugador D"
              },
              {
                entityType: "player",
                eventId: 51,
                playerId: 383,
                teamId: 9,
                name: "Jugador A"
              }
            ]
          };

          const snapshot = {
            game_id: "nba-test-Boston-Detroit",
            away_team_id: 2,
            home_team_id: 9,
            game_time: "2026-10-20T23:00:00Z",
            checked_at: "2026-10-20T16:00:00Z",
            provider: "balldontlie",
            injuries: [
              {
                player_id: "383",
                team_id: "9",
                status: "out"
              },
              {
                player_id: "42",
                team_id: "2",
                status: "day-to-day"
              }
            ]
          };

          const linked =
            prepareNBAInjuryShadowPlayers({
              slate,
              injurySnapshots: [snapshot],
              cutoffAt
            });

          assert.equal(linked.players.length, 4);
          assert.equal(linked.matchedPlayers, 4);
          assert.equal(linked.unverifiedPlayers, 0);

          const checkPlayer = (playerId, teamId) =>
            buildNBAInjuryContext({
              snapshot,
              cutoffAt,
              playerId,
              teamId
            });

          // Confirmado OUT.

          const out = checkPlayer("383", "9");

          assert.equal(out.usable, true);
          assert.equal(out.playerStatus, "out");

          // Compañero del lesionado.

          const teammate = checkPlayer("44", "9");

          assert.equal(
            teammate.ruledOutTeammates.length,
            1
          );

          // Jugador incierto.

          const uncertain = checkPlayer("42", "2");

          assert.equal(
            uncertain.playerStatus,
            "uncertain"
          );

          // Reporte posterior a la prediccion.

          const future =
            prepareNBAInjuryShadowPlayers({
              slate,
              cutoffAt,
              injurySnapshots: [{
                ...snapshot,
                checked_at: "2026-10-20T19:00:00Z"
              }]
            });

          assert.equal(future.matchedPlayers, 0);

          // Equipos incorrectos.

          const mismatch =
            prepareNBAInjuryShadowPlayers({
              slate,
              cutoffAt,
              injurySnapshots: [{
                ...snapshot,
                home_team_id: 99
              }]
            });

          assert.equal(mismatch.matchedPlayers, 0);

          console.log("NBA INJURY BRIDGE: OK");
          NODE

  optimizer-tests:
    name: Fantasy Lineup Optimizer Tests
    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test lineup optimizer
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const {
            optimizeFantasyLineup
          } = require("./fantasy-engine/shared/lineup-optimizer");

          const {
            getContestConfig,
            validateClassicLineup
          } = require("./fantasy-engine/shared/contest-config");

          function makePool(sport) {
            const positions = sport === "nba"
              ? [
                  "PG", "PG", "PG",
                  "SG", "SG", "SG",
                  "SF", "SF", "SF",
                  "PF", "PF", "PF",
                  "C", "C"
                ]
              : [
                  "QB", "QB",
                  "RB", "RB", "RB",
                  "WR", "WR", "WR", "WR",
                  "TE", "TE",
                  "DST", "DST"
                ];

            return positions.map((position, i) => ({
              playerId: `P${i + 1}`,
              name: `Test Player ${i + 1}`,
              position,
              teamId: `T${i % 6}`,
              gameId: `G${i % 3}`,
              salary: 4500,
              projectedPoints: 15 + i
            }));
          }

          for (const sport of ["nba", "nfl"]) {
            for (const platform of ["draftkings", "fanduel"]) {

              const config = getContestConfig({
                sport,
                platform
              });

              const slate = {
                id: "test-slate",
                sport,
                platform,
                format: "classic",
                gameIds: ["G0", "G1", "G2"]
              };

              const players = makePool(sport);

              const run = options =>
                optimizeFantasyLineup({
                  sport,
                  platform,
                  slate,
                  players,
                  ...options
                });

              // Alineacion completa.

              const result = run();

              assert.equal(result.found, true);
              assert.equal(result.mode, "shadow");
              assert.equal(result.contestVerified, false);
              assert.equal(result.readyForPublication, false);
              assert.equal(result.optimalityGuaranteed, false);

              assert.equal(
                result.lineup.length,
                config.rosterSize
              );

              assert.ok(
                result.salary <= config.salaryCap
              );

              const ids = result.lineup.map(
                p => p.playerId
              );

              assert.equal(
                new Set(ids).size,
                config.rosterSize
              );

              const validation = validateClassicLineup({
                sport,
                platform,
                slate,
                lineup: result.lineup
              });

              assert.equal(
                validation.structurallyValid,
                true
              );

              // Bloquear un jugador.

              const lockedId = "P1";

              const locked = run({
                locked: [lockedId]
              });

              assert.equal(locked.found, true);

              assert.ok(
                locked.lineup.some(
                  p => p.playerId === lockedId
                )
              );

              // Excluir un jugador.

              const excluded = run({
                excluded: [lockedId]
              });

              assert.equal(excluded.found, true);

              assert.ok(
                excluded.lineup.every(
                  p => p.playerId !== lockedId
                )
              );

              // Bloqueo y exclusion simultaneos.

              assert.throws(
                () => run({
                  locked: [lockedId],
                  excluded: [lockedId]
                }),
                /bloqueado y excluido/
              );

              // Presupuesto insuficiente.

              const expensive = run({
                players: players.map(p => ({
                  ...p,
                  salary: config.salaryCap
                }))
              });

              assert.equal(
                expensive.found,
                false
              );

              console.log(
                `OK ${sport.toUpperCase()} ${platform}`
              );
            }
          }

          console.log(
            "FANTASY LINEUP OPTIMIZER: ALL TESTS PASSED"
          );
          NODE

 
  real-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: NBA NFL Real Data Shadow

    needs: fantasy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase client
        run: |
          npm install --prefix fantasy-engine --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2

      - name: Run NBA NFL real shadow test
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_ANON_KEY: ${{ secrets.FANTASY_SUPABASE_ANON_KEY }}
        run: |
          node fantasy-engine/tests/real-shadow.js
