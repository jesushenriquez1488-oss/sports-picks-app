
name: Fantasy NBA Minutes Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/nba-minutes-backtest-shadow.js"
      - ".github/workflows/fantasy-nba-minutes-backtest.yml"

jobs:
  backtest:
    if: github.ref == 'refs/heads/fantasy-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Fantasy Development
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase Client
        run: npm install --no-save --no-package-lock @supabase/supabase-js

      - name: Build Identity Report
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-identity-builder.js

      - name: Build Historical Context
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-fantasy-history-shadow.js

      - name: Backtest Minutes Models
        run: node fantasy-engine/nba-minutes-backtest-shadow.js

      - name: Save Backtest Report
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-nba-minutes-backtest
          path: fantasy-shadow-input/nba-minutes-backtest.json
          retention-days: 7
          if-no-files-found: error
