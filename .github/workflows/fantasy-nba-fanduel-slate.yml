
name: CashEdge NBA FanDuel Real Slate

on:
  workflow_dispatch:

  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nba-fanduel-slate.yml"

permissions:
  contents: read

jobs:
  fanduel-slate:
    name: Identify Real FanDuel Full Roster
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect FanDuel slates
        env:
          BALLDONTLIE_NBA_API_KEY: ${{ secrets.BALLDONTLIE_NBA_API_KEY }}
          FANTASY_DATE: "2026-10-21"
        run: |
          node <<'NODE'
          "use strict";

          const fs = require("node:fs");

          const API =
            "https://api.balldontlie.io/nba/v1/dfs";

          const key =
            process.env.BALLDONTLIE_NBA_API_KEY;

          const date =
            process.env.FANTASY_DATE;

          if (!key) {
            throw new Error(
              "BALLDONTLIE_NBA_API_KEY missing"
            );
          }

          async function request(path, params = {}) {
            const url = new URL(API + path);

            for (const [name, value] of
              Object.entries(params)) {
              url.searchParams.append(name, value);
            }

            for (let attempt = 0;
              attempt < 4;
              attempt++) {

              const response = await fetch(
                url.toString(),
                {
                  headers: {
                    Authorization: key
                  }
                }
              );

              if (
                response.status === 429 ||
                response.status >= 500
              ) {
                if (attempt === 3) {
                  throw new Error(
                    "API HTTP " + response.status
                  );
                }

                await new Promise(resolve =>
                  setTimeout(
                    resolve,
                    1500 * (attempt + 1)
                  )
                );

                continue;
              }

              if (!response.ok) {
                throw new Error(
                  "API HTTP " +
                  response.status +
                  " at " + path
                );
              }

              return response.json();
            }
          }

          async function listAll(path, params) {
            const items = [];
            const seen = new Set();

            let cursor = null;

            for (let page = 0; page < 100; page++) {
              const query = {
                ...params,
                per_page: "100"
              };

              if (cursor !== null) {
                query.cursor = String(cursor);
              }

              const response = await request(
                path,
                query
              );

              if (!Array.isArray(response.data)) {
                throw new Error(
                  "Invalid paginated response"
                );
              }

              items.push(...response.data);

              const next =
                response.meta?.next_cursor;

              if (
                next === null ||
                next === undefined
              ) {
                return items;
              }

              if (seen.has(String(next))) {
                throw new Error(
                  "Repeated cursor"
                );
              }

              seen.add(String(next));
              cursor = next;
            }

            throw new Error(
              "Pagination exceeded 100 pages"
            );
          }

          function rosterSlots(slate) {
            return (slate.roster_slots || [])
              .filter(slot =>
                slot.active !== false
              )
              .map(slot => ({
                id: slot.id,
                name: slot.name,
                count: slot.required_count,
                active: slot.active
              }));
          }

          function isClassicFullRoster(slate) {
            const slots = rosterSlots(slate);
            const counts = {};

            for (const slot of slots) {
              const name = String(
                slot.name || ""
              ).trim().toUpperCase();

              counts[name] =
                (counts[name] || 0) +
                Number(slot.count || 0);
            }

            return (
              Number(slate.salary_cap) === 60000 &&
              counts.PG === 2 &&
              counts.SG === 2 &&
              counts.SF === 2 &&
              counts.PF === 2 &&
              counts.C === 1 &&
              Object.keys(counts).length === 5
            );
          }

          async function main() {
            console.log(
              "=== CASHEDGE FANDUEL DISCOVERY ==="
            );

            console.log("Date:", date);

            // No aplicar restricciones prematuras
            // de formato y scope.
            const slates = await listAll(
              "/slates",
              {
                "providers[]": "fanduel",
                start_date: date,
                end_date: date
              }
            );

            console.log(
              "FANDUEL SLATES FOUND:",
              slates.length
            );

            const reports = [];
            const details = [];

            for (const item of slates) {
              const response = await request(
                "/slates/" + item.id
              );

              const slate = response.data;

              if (!slate) {
                throw new Error(
                  "Missing detail for slate " +
                  item.id
                );
              }

              details.push(slate);

              const report = {
                id: slate.id,
                provider: slate.provider,
                format: slate.format,
                scope: slate.scope,
                style: slate.style,
                status: slate.status,
                active: slate.active,
                salaryCap: slate.salary_cap,
                eventCount: slate.event_count,
                startsAt: slate.starts_at,
                rosterSlots: rosterSlots(slate),
                events: (
                  slate.events || []
                ).map(event => ({
                  id: event.id,
                  gameId: event.game_id,
                  name: event.name,
                  active: event.active
                })),
                verifiedFullRoster:
                  isClassicFullRoster(slate)
              };

              reports.push(report);

              console.log(
                "\n=== FANDUEL SLATE " +
                slate.id + " ==="
              );

              console.log(
                JSON.stringify(report, null, 2)
              );
            }

            const verified = reports.filter(
              row => row.verifiedFullRoster
            );

            console.log(
              "\n=== VERIFIED FULL ROSTER ==="
            );

            console.log(
              JSON.stringify(
                verified.map(row => ({
                  slateId: row.id,
                  games: row.events.length,
                  salaryCap: row.salaryCap,
                  slots: row.rosterSlots,
                  startsAt: row.startsAt
                })),
                null,
                2
              )
            );

            fs.mkdirSync(
              "fantasy-fanduel-results",
              { recursive: true }
            );

            fs.writeFileSync(
              "fantasy-fanduel-results/fanduel-discovery.json",
              JSON.stringify(
                {
                  date,
                  discovered: reports.length,
                  verified: verified.length,
                  slates: reports
                },
                null,
                2
              )
            );

            console.log(
              "\n=== FINAL STATUS ==="
            );

            console.log(
              "Discovery: PASS"
            );

            console.log(
              "Full Roster candidates:",
              verified.length
            );

            console.log(
              "No CSV required"
            );

            console.log(
              "No database changes"
            );

            console.log(
              "Mode: SHADOW"
            );
          }

          main().catch(error => {
            console.error(
              "FANDUEL ERROR:",
              error.message
            );

            process.exitCode = 1;
          });
          NODE

      - name: Save FanDuel discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-fanduel-discovery
          path: fantasy-fanduel-results/*.json
          if-no-files-found: warn
          retention-days: 7
