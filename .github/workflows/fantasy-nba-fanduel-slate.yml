
name: CashEdge NBA FanDuel Real Slate

on:
  workflow_dispatch:

  push:
    branches:
      - fantasy-dev
    paths:
      - ".github/workflows/fantasy-nba-fanduel-slate.yml"

permissions:
  contents: read

jobs:
  fanduel-slate:
    name: Capture FanDuel Full Roster
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture real FanDuel roster
        env:
          BALLDONTLIE_NBA_API_KEY: ${{ secrets.BALLDONTLIE_NBA_API_KEY }}
        run: |
          node <<'NODE'
          "use strict";

          const fs = require("node:fs");

          const SLATE_ID = 78196;

          const API =
            "https://api.balldontlie.io/nba/v1/dfs";

          const key =
            process.env.BALLDONTLIE_NBA_API_KEY;

          if (!key) {
            throw new Error("Missing NBA API key");
          }

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          async function request(path, params = {}) {
            const url = new URL(API + path);

            for (const [name, value] of Object.entries(params)) {
              url.searchParams.append(name, value);
            }

            for (let attempt = 0; attempt < 4; attempt++) {
              const response = await fetch(url, {
                headers: {
                  Authorization: key
                }
              });

              if (
                response.status === 429 ||
                response.status >= 500
              ) {
                if (attempt === 3) {
                  throw new Error(
                    "BALLDONTLIE HTTP " + response.status
                  );
                }

                await sleep(1500 * (attempt + 1));
                continue;
              }

              if (!response.ok) {
                throw new Error(
                  "BALLDONTLIE HTTP " +
                  response.status +
                  " " + path
                );
              }

              return response.json();
            }
          }

          async function allPages(path, params) {
            const records = [];
            const cursors = new Set();
            let cursor = null;

            for (let page = 0; page < 100; page++) {
              const query = {
                ...params,
                per_page: "100"
              };

              if (cursor !== null) {
                query.cursor = String(cursor);
              }

              const result = await request(path, query);

              if (!Array.isArray(result.data)) {
                throw new Error("Invalid API data");
              }

              records.push(...result.data);

              const next = result.meta?.next_cursor;

              if (next === null || next === undefined) {
                return records;
              }

              if (cursors.has(String(next))) {
                throw new Error("Repeated cursor");
              }

              cursors.add(String(next));
              cursor = next;
            }

            throw new Error("Pagination limit exceeded");
          }

          function getSlots(slate) {
            return (slate.roster_slots || [])
              .filter(slot => slot.active !== false)
              .map(slot => ({
                id: String(slot.id),
                name: String(slot.name).toUpperCase(),
                count: Number(slot.required_count)
              }));
          }

          function verifySlate(slate) {
            const required = [
              "PG", "SG", "SF", "PF", "C",
              "G/F", "F/C", "UTIL", "UTIL"
            ].sort();

            const actual = getSlots(slate)
              .flatMap(slot =>
                Array(slot.count).fill(slot.name)
              )
              .sort();

            if (
              Number(slate.id) !== SLATE_ID ||
              slate.provider !== "fanduel" ||
              slate.format !== "salary_cap" ||
              slate.style !== "Full Roster" ||
              Number(slate.salary_cap) !== 60000 ||
              actual.length !== 9 ||
              JSON.stringify(actual) !==
                JSON.stringify(required)
            ) {
              throw new Error(
                "Slate roster verification failed: " +
                JSON.stringify({
                  id: slate.id,
                  style: slate.style,
                  salaryCap: slate.salary_cap,
                  actual
                })
              );
            }

            if (
              !Array.isArray(slate.events) ||
              slate.events.filter(e => e.active !== false)
                .length !== 11
            ) {
              throw new Error(
                "Expected 11 active games"
              );
            }
          }

          async function main() {
            console.log(
              "=== FANDUEL NBA FULL ROSTER ==="
            );

            const detail = await request(
              "/slates/" + SLATE_ID
            );

            const slate = detail.data;

            if (!slate) {
              throw new Error("Missing slate detail");
            }

            verifySlate(slate);

            const entries = await allPages(
              "/draftables",
              {
                "slate_ids[]": String(SLATE_ID)
              }
            );

            const eventIds = new Set(
              slate.events
                .filter(e => e.active !== false)
                .map(e => String(e.id))
            );

            const slotIds = new Set(
              getSlots(slate).map(s => s.id)
            );

            const byPlayer = new Map();
            const excluded = [];
            const missingIds = [];

            for (const entry of entries) {
              if (
                entry.active === false ||
                entry.is_disabled === true ||
                entry.entity_type !== "player" ||
                !eventIds.has(
                  String(entry.slate_event_id)
                ) ||
                !slotIds.has(
                  String(entry.roster_slot_id)
                )
              ) {
                continue;
              }

              if (
                entry.player_id == null ||
                entry.team_id == null ||
                entry.game_id == null
              ) {
                missingIds.push({
                  draftableId: entry.id,
                  player: entry.display_name
                });

                continue;
              }

              const status = String(
                entry.status || ""
              ).trim().toLowerCase();

              if (
                ["o", "out", "inactive", "ir", "suspended"]
                  .includes(status)
              ) {
                excluded.push({
                  player: entry.display_name,
                  reason: "provider_out"
                });

                continue;
              }

              const salary = Number(entry.salary);

              if (
                !Number.isFinite(salary) ||
                salary <= 0
              ) {
                continue;
              }

              const playerId =
                String(entry.player_id);

              const position =
                String(entry.position || "")
                  .trim().toUpperCase();

              if (
                !["PG", "SG", "SF", "PF", "C"]
                  .includes(position)
              ) {
                continue;
              }

              const previous =
                byPlayer.get(playerId);

              if (!previous) {
                byPlayer.set(playerId, {
                  playerId,
                  name: entry.display_name ||
                    [
                      entry.first_name,
                      entry.last_name
                    ].filter(Boolean).join(" "),
                  teamId: String(entry.team_id),
                  gameId: String(entry.game_id),
                  salary,
                  positions: [position],
                  team: entry.team_abbreviation,
                  providerStatus: entry.status,
                  draftableIds: [String(entry.id)]
                });

                continue;
              }

              if (
                previous.salary !== salary ||
                previous.teamId !==
                  String(entry.team_id) ||
                previous.gameId !==
                  String(entry.game_id)
              ) {
                throw new Error(
                  "Conflicting player records: " +
                  playerId +
                  ". Preserve raw entries before optimizing."
                );
              }

              if (!previous.positions.includes(position)) {
                previous.positions.push(position);
              }

              previous.draftableIds.push(
                String(entry.id)
              );
            }

            const players = [...byPlayer.values()];

            if (players.length < 50) {
              throw new Error(
                "Incomplete player pool: " +
                players.length
              );
            }

            const capturedAt =
              new Date().toISOString();

            const output = {
              sport: "nba",
              platform: "fanduel",
              slateId: String(SLATE_ID),
              format: "full_roster",
              mode: "shadow",
              complete: true,
              capturedAt,
              startsAt: slate.starts_at,
              salaryCap: Number(slate.salary_cap),
              rosterSlots: getSlots(slate),
              games: slate.events.filter(
                e => e.active !== false
              ),
              players,
              excluded,
              missingIds,
              source: "balldontlie"
            };

            fs.mkdirSync(
              "fantasy-fanduel-results",
              { recursive: true }
            );

            fs.writeFileSync(
              "fantasy-fanduel-results/fanduel-78196.json",
              JSON.stringify(output, null, 2)
            );

            console.log(
              "\n=== VERIFIED FANDUEL SLATE ==="
            );

            console.log(
              JSON.stringify({
                slateId: output.slateId,
                salaryCap: output.salaryCap,
                rosterSlots: output.rosterSlots.map(
                  slot => slot.name
                ),
                games: output.games.length,
                rawDraftables: entries.length,
                eligiblePlayers: players.length,
                excludedOut: excluded.length,
                missingIds: missingIds.length,
                capturedAt
              }, null, 2)
            );

            console.log(
              "\n=== FIRST 10 PLAYERS ==="
            );

            for (const player of players.slice(0, 10)) {
              console.log(JSON.stringify({
                name: player.name,
                team: player.team,
                salary: player.salary,
                positions: player.positions
              }));
            }

            console.log("\nFINAL STATUS: PASS");
            console.log("Mode: SHADOW");
            console.log("No database changes");
            console.log("No publication");
          }

          main().catch(error => {
            console.error(
              "FANDUEL CAPTURE ERROR:",
              error.message
            );

            process.exitCode = 1;
          });
          NODE

      - name: Save real FanDuel data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashedge-nba-fanduel-78196
          path: fantasy-fanduel-results/*.json
          if-no-files-found: warn
          retention-days: 7
