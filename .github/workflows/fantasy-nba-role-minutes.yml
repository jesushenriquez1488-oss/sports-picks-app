
name: Fantasy NBA Role Minutes SHADOW

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/nba-fantasy-integration-shadow.js"
      - ".github/workflows/fantasy-nba-role-minutes.yml"

jobs:
  role-minutes:
    if: github.ref == 'refs/heads/fantasy-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Fantasy Development
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase Client
        run: npm install --no-save --no-package-lock @supabase/supabase-js

      - name: Build ESPN Identity Report
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-identity-builder.js

      - name: Build ESPN Rotation Context
        run: node fantasy-engine/nba-rotation-context-builder.js

      - name: Build NBA Historical Context
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-fantasy-history-shadow.js

      - name: Build Role Minutes Baseline
        run: node fantasy-engine/nba-minutes-shadow.js

      - name: Calculate Role-Aware Minutes
        run: node fantasy-engine/nba-role-minutes-shadow.js

      - name: Run Fantasy NBA Core V1
        run: node fantasy-engine/nba-fantasy-core-shadow.js

      - name: Audit Missing Starting Players
        run: node fantasy-engine/nba-starter-gaps-audit.js

      - name: Final Role and Minutes Comparison
        run: node fantasy-engine/nba-minutes-final-check-shadow.js

      - name: Recover Starter Historical Data
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-fantasy-integration-shadow.js

      - name: Save Fantasy Reports
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-nba-core-shadow
          path: |
            fantasy-shadow-input/nba-identity-report.json
            fantasy-shadow-input/nba-rotation-context.json
            fantasy-shadow-input/nba-fantasy-history.json
            fantasy-shadow-input/nba-role-minutes-shadow.json
            fantasy-shadow-input/nba-fantasy-core-shadow.json
            fantasy-shadow-input/nba-starter-gaps-audit.json
            fantasy-shadow-input/nba-minutes-final-check-shadow.json
            fantasy-shadow-input/nba-fantasy-integration-shadow.json
          retention-days: 7
          if-no-files-found: error
