
name: Fantasy NBA Role Minutes SHADOW

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/nba-fantasy-context-shadow.js"
      - "fantasy-engine/nba-fantasy-context-lineups-shadow.py"
      - ".github/workflows/fantasy-nba-role-minutes.yml"

jobs:
  fantasy-nba:
    if: github.ref == 'refs/heads/fantasy-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install --no-save --no-package-lock @supabase/supabase-js
          python -m pip install "ortools>=9.10,<10"

      - name: Refresh ESPN Depth Charts
        run: node fantasy-engine/espn-depthchart-league-audit.js

      - name: Refresh ESPN Identity
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-identity-builder.js

      - name: Build ESPN Rotation Context
        run: node fantasy-engine/nba-rotation-context-builder.js

      - name: Read NBA Historical Box Scores
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-fantasy-history-shadow.js

      - name: Recover Player Historical Data
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-fantasy-integration-shadow.js

      - name: Fetch Real NBA DFS Slates
        env:
          BALLDONTLIE_NBA_API_KEY: ${{ secrets.BALLDONTLIE_NBA_API_KEY }}
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
          FANTASY_TARGET_DATE: "2026-10-22"
        run: node fantasy-engine/nba-fantasy-live-slate-shadow.js

      - name: Evaluate Defense and Injury Context
        env:
          BALLDONTLIE_NBA_API_KEY: ${{ secrets.BALLDONTLIE_NBA_API_KEY }}
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
          FANTASY_TARGET_DATE: "2026-10-22"
        run: node fantasy-engine/nba-fantasy-context-shadow.js

      - name: Generate Contextual SHADOW Lineups
        run: python fantasy-engine/nba-fantasy-context-lineups-shadow.py

      - name: Save Fantasy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-nba-context-shadow
          path: |
            fantasy-shadow-input/nba-identity-report.json
            fantasy-shadow-input/nba-rotation-context.json
            fantasy-shadow-input/nba-fantasy-history.json
            fantasy-shadow-input/nba-fantasy-integration-shadow.json
            fantasy-slate-data/nba-draftkings-live-shadow.json
            fantasy-slate-data/nba-draftkings-context-shadow.json
            fantasy-slate-data/nba-draftkings-context-lineups-shadow.json
            fantasy-slate-data/nba-fanduel-live-shadow.json
            fantasy-slate-data/nba-fanduel-context-shadow.json
            fantasy-slate-data/nba-fanduel-context-lineups-shadow.json
          retention-days: 7
          if-no-files-found: warn
