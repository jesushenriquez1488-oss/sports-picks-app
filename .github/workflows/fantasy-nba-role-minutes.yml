
name: Fantasy NBA Role Minutes SHADOW

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Crear muestra B o evaluar resultados"
        type: choice
        required: true
        default: build
        options:
          - build
          - evaluate

  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/nba-fantasy-advanced-shadow.js"
      - "fantasy-engine/nba-fantasy-experiment-shadow.py"
      - ".github/workflows/fantasy-nba-role-minutes.yml"

permissions:
  contents: write

jobs:
  experiment:
    if: github.ref == 'refs/heads/fantasy-dev'

    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      FANTASY_TARGET_DATE: "2026-10-22"
      BALLDONTLIE_NBA_API_KEY: ${{ secrets.BALLDONTLIE_NBA_API_KEY }}
      FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
      FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout fantasy-dev
        uses: actions/checkout@v4
        with:
          ref: fantasy-dev
          persist-credentials: true

      - name: Setup Node 22
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install "ortools>=9.10,<10"

          if [ "${{ inputs.mode }}" != "evaluate" ]; then
            npm install --no-save --no-package-lock @supabase/supabase-js
          fi

      - name: Refresh ESPN Depth Charts
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/espn-depthchart-league-audit.js

      - name: Build ESPN Identity
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-identity-builder.js

      - name: Build Rotation Context
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-rotation-context-builder.js

      - name: Load NBA Historical Statistics
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-fantasy-history-shadow.js

      - name: Recover Historical Player Matches
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-fantasy-integration-shadow.js

      - name: Download Official DFS Slate
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-fantasy-live-slate-shadow.js

      - name: Compute Original Context
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: node fantasy-engine/nba-fantasy-context-shadow.js

      - name: Freeze Sample A
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: |
          if [ -f fantasy-experiments/2026-10-22/sample-a.json ]; then
            echo "Sample A already frozen."
          else
            python fantasy-engine/nba-fantasy-experiment-shadow.py freeze
          fi

      - name: Save Sample A to fantasy-dev
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fantasy-experiments/2026-10-22/sample-a.json

          if ! git diff --cached --quiet; then
            git commit -m "shadow: freeze October 22 Fantasy sample A"
            git push origin HEAD:fantasy-dev
          fi

      - name: Advanced Defense and Similar Players
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: |
          if [ -f fantasy-experiments/2026-10-22/sample-b.json ]; then
            echo "Sample B already frozen."
          else
            node fantasy-engine/nba-fantasy-advanced-shadow.js
            python fantasy-engine/nba-fantasy-experiment-shadow.py build
          fi

      - name: Save Sample B to fantasy-dev
        if: github.event_name == 'push' || inputs.mode != 'evaluate'
        run: |
          git add fantasy-experiments/2026-10-22/sample-b.json

          if ! git diff --cached --quiet; then
            git commit -m "shadow: freeze October 22 Fantasy sample B"
            git push origin HEAD:fantasy-dev
          fi

      - name: Evaluate Actual Fantasy Results
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'evaluate'
        run: python fantasy-engine/nba-fantasy-experiment-shadow.py evaluate

      - name: Save A-B Comparison
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'evaluate'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fantasy-experiments/2026-10-22/comparison-after-games.json

          if ! git diff --cached --quiet; then
            git commit -m "shadow: evaluate October 22 Fantasy A-B"
            git push origin HEAD:fantasy-dev
          fi

      - name: Save Experiment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-nba-ab-oct22-${{ github.run_id }}
          path: |
            fantasy-experiments/2026-10-22/*.json
            fantasy-slate-data/nba-draftkings-context-shadow.json
            fantasy-slate-data/nba-draftkings-advanced-shadow.json
          retention-days: 14
          if-no-files-found: warn
