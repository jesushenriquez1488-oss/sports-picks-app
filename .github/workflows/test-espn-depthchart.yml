
name: Test ESPN NBA Depth Chart

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/espn-depthchart-probe.js"
      - "fantasy-engine/espn-depthchart-normalizer.js"
      - ".github/workflows/test-espn-depthchart.yml"

jobs:
  test-espn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ESPN NBA Depth Chart Normalizer
        run: node fantasy-engine/espn-depthchart-normalizer.js
