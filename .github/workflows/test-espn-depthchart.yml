
name: Test ESPN NBA Depth Chart

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/espn-depthchart-probe.js"
      - "fantasy-engine/espn-depthchart-normalizer.js"
      - "fantasy-engine/nba-identity-builder.js"
      - "fantasy-engine/nba-rotation-context-builder.js"
      - ".github/workflows/test-espn-depthchart.yml"

jobs:
  test-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Fantasy Development
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase Client
        run: npm install --no-save --no-package-lock @supabase/supabase-js

      - name: Build NBA Identity Report
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/nba-identity-builder.js

      - name: Build NBA Rotation Context
        run: node fantasy-engine/nba-rotation-context-builder.js

      - name: Save NBA Shadow Reports
        uses: actions/upload-artifact@v4
        with:
          name: nba-rotation-shadow-reports
          path: |
            fantasy-shadow-input/nba-identity-report.json
            fantasy-shadow-input/nba-rotation-context.json
          retention-days: 7
          if-no-files-found: error
