
name: Test ESPN NBA Depth Chart

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dev
    paths:
      - "fantasy-engine/espn-depthchart-probe.js"
      - "fantasy-engine/espn-depthchart-normalizer.js"
      - "fantasy-engine/espn-depthchart-league-audit.js"
      - "fantasy-engine/espn-sarr-identity-check.js"
      - "fantasy-engine/espn-nba-identity-audit.js"
      - ".github/workflows/test-espn-depthchart.yml"

jobs:
  test-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Fantasy Development
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        run: node --version

      - name: Install Supabase Client
        run: npm install --no-save --no-package-lock @supabase/supabase-js

      - name: Run NBA ESPN Identity Audit
        env:
          FANTASY_SUPABASE_URL: ${{ secrets.FANTASY_SUPABASE_URL }}
          FANTASY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANTASY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node fantasy-engine/espn-nba-identity-audit.js
