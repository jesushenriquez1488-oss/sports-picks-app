<div class="app">

  <div class="hero">
    <span class="badge">AI Sports Picks</span>
    <h1 id="appTitle">NBA Picks App</h1>
    <p id="appSubtitle">Análisis automático con odds y proyección del modelo</p>
  </div>

  <div class="league-tabs">
 <button class="league-btn active" onclick="selectSport(event,'basketball_nba','NBA')">NBA</button>
<button class="league-btn" onclick="selectSport(event,'basketball_wnba','WNBA')">WNBA</button>
<button class="league-btn" onclick="selectSport(event,'basketball_ncaab','NCAAB')">NCAAB</button>
<button class="league-btn" onclick="selectSport(event,'basketball_euroleague','EuroLeague')">EuroLeague</button>
  </div>

  <button id="searchBtn" onclick="loadGames()">Buscar juegos NBA</button>

  <div id="status"></div>
  <div id="games"></div>

</div>
<div class="accuracy-box">
  <div>
    <strong>Premium Picks</strong>
    <span id="premiumRate">88% aciertos</span>
  </div>

  <div>
    <strong>Normal Picks</strong>
    <span id="normalRate">65% aciertos</span>
  </div>
</div>
